apiVersion: vellym.tasclub.com/v1alpha1
kind: Page
metadata:
  name: document-format
  title: Document format and compatibility
spec:
  documentType: compatibility-policy
  locale: en
  blocks:
    - id: contract
      type: rich-text
      format: commonmark
      content: |
        ## Current compatibility stage

        `vellym.tasclub.com/v1` is the default format generated from beta onward, and may
        change until it is frozen for the 1.0 release candidate.
        `vellym.tasclub.com/v1alpha1` was the default during alpha and remains readable,
        editable, and searchable. Vellym never migrates documents automatically; run
        `vellym migrate --to v1` explicitly to move them.

        ## How the format evolves

        Vellym does not evolve the format by accumulating versions. The rules are:

        1. **Additions never bump the version.** New block types and new optional `metadata`
           or `spec` properties stay valid under the existing version. The schema allows
           `additionalProperties` and preserves unknown blocks and properties, so an older
           Vellym can still read a newer document.
        2. **The version is bumped only for a breaking change**: a new required property,
           a change in the meaning of an existing property, or a removal.
        3. **Only one conversion step is provided**, from the immediately preceding version.
           No direct v1-to-v3 conversion is written.
        4. **At most two versions are supported at a time.** Once a new version ships, the
           previous one is removed in the next major release.

        As a result, Vellym ships a single Page schema rather than one per version.
        `apiVersion` is not a record of when a file was generated; it declares how the file
        should be read. The schema is split only when a version is genuinely structurally
        different.

        Published schema URLs remain version-specific and accept only that version's
        `apiVersion`.

        ## v1 resource envelope

        - `apiVersion: vellym.tasclub.com/v1`
        - `kind: Page` or `kind: Folder`
        - `metadata`: identity and display information
        - `spec`: resource content

        A Page identity is the lowercase alphanumeric and hyphen value in `metadata.name`.
        Changing a title, slug, path, or filename does not implicitly change that identity.
        A Page contains ordered `spec.blocks`; v1 defines CommonMark `rich-text` blocks.
        Unknown blocks and properties are preserved as extension points.

        A Folder is represented by an optional `_index.yaml`. `metadata.title` is its display
        name, while `spec.description` and `spec.order` are optional. Each order entry is an
        immediate filename or directory name.

        ## Published schemas

        - [Page v1](https://vellym.tasclub.com/schemas/v1/page.schema.json)
        - [Folder v1](https://vellym.tasclub.com/schemas/v1/folder.schema.json)
        - [rich-text v1](https://vellym.tasclub.com/schemas/v1/rich-text-block.schema.json)
        - [config 1.0](https://vellym.tasclub.com/schemas/config-v1.schema.json)

        ## Saving and migration

        Editing known fields preserves comments, unknown properties, and unknown blocks.
        Aliases, anchors, custom tags, and multiple YAML documents are read-only because safe
        round trips cannot be guaranteed.

        Review `vellym migrate --to v1 --plan` before running `vellym migrate --to v1`.
        Migration checks source hashes, writes through temporary files, and restores written
        files after a partial failure. It does not run Git, so commit or back up the project first.

        ## Planned 1.0 stability boundary

        The stability contract covers v1 Page and Folder YAML, config schema 1.0, public CLI
        commands, options and exit codes, and public JSON envelopes. Internal workspace packages,
        browser-server HTTP endpoints, generated SPA data, CSS, and DOM are not public APIs.
