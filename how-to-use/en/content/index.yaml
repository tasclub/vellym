        ## What is Vellym

        **Vellym** is a document management tool that keeps the source of truth for
        your documents as Git-managed YAML, and serves the same content in two forms
        depending on the audience.

        - For **humans**, it presents readable documents in the browser.
        - For **external AI agents**, it exposes plain structured files (YAML).

        The single source of truth is YAML; HTML and static sites are **generated
        artifacts** derived from it. Because the source is text, Git diffing, history,
        and review work as-is.

        ## Highlights

        - The source of truth is Git-managed YAML: easy to version, review, and branch.
        - Reading happens in a browser SPA. Editing works either in the browser or by
          editing YAML directly.
        - You can export a read-only static site for hosting or distributing materials.
        - No AI model, AI chat, AI generation, or AI review is embedded in the product.
          External AI tools may still treat the YAML/JSON/CLI as ordinary files.

        ## Who this guide is for

        This guide targets two kinds of readers.

        - **Operators** who initialize and run the tool via the CLI, and run the static
          site or self-hosting.
        - **Users** who read documents in the browser and author them in YAML or rich text.

        A public library SDK for embedding the product is not provided at this stage, so
        this guide does not cover developer usage of the internal packages.

