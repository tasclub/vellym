  blocks:
    - id: configuration
      type: rich-text
      format: commonmark
      content: |
        ## vellym.config.yaml

        プロジェクトの設定は、project root直下の`vellym.config.yaml`に置く。
        既定のファイル名で、`--config`で別パスも指定できる（[CLIリファレンス](#page=cli-reference)）。

        ```yaml
        schemaVersion: "1.0"
        contentRoot: content
        outputDir: dist
        ui:
          language: ja
        plugins: []
        ```

        ## 各項目

        | キー | 必須 | 型・値 | 説明 |
        | --- | --- | --- | --- |
        | `schemaVersion` | はい | `"1.0"` | 設定スキーマのバージョン。現在は`"1.0"`固定。 |
        | `contentRoot` | はい | 文字列 | 正本YAMLを置くルートディレクトリ（project rootからの相対path）。`./`や`..`で始まる指定はできない。 |
        | `outputDir` | はい | 文字列 | 静的サイト生成（`build`）の出力先の基準。 |
        | `ui.language` | はい | `ja` \| `en` | ブラウザSPAの表示言語。一つのビルドにつき一言語。 |
        | `plugins` | はい | 文字列の配列 | プラグイン指定。現段階では未実装のため空配列`[]`とする。 |

        ## outputDirと生成先

        `build`は、`outputDir`をそのまま出力先にするのではなく、`outputDir`の**親**
        ディレクトリの下に、生成日時を付けた一意なフォルダを作る
        （例: `20260728-143002-dist`）。これにより毎回の生成が上書きされずに残る。
        配信・世代管理の詳細は[静的配信と自己ホスト](#page=self-hosting)を参照。

        ## 言語と設定の関係

        `ui.language`はブラウザ表示の言語であり、各Pageの`spec.locale`とは別である。
        日本語と英語を併記したい場合の考え方は[用語と基本概念](#page=concepts)を参照。

        ## 関連

        - コマンド → [CLIリファレンス](#page=cli-reference)
        - 文書の書き方 → [文書の書き方（YAML）](#page=authoring)
