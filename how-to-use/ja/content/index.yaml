      content: |
        ## Vellymとは

        **Vellym**は、ドキュメントの正本をGitで管理できるYAMLとして保持し、
        同じ内容を用途に応じて二つの形で提供するドキュメント管理ツールである。

        - **人間**には、ブラウザ上の読みやすい文書として提供する。
        - **外部AIエージェント**には、通常の構造化ファイル（YAML）として提供する。

        文書の唯一の正本はYAMLであり、HTMLや静的サイトはそこから生成される
        **生成物**として扱う。正本はテキストであるため、Gitでの差分・履歴・レビューが
        そのまま利用できる。

        > **このサイト自体がVellymで生成されている。**
        > いま読んでいるページの正本はYAMLであり、`vellym build`で静的サイトとして
        > 出力したものを配信している。Vellymの出力がどう見えるかは、この文書自体が例になる。

        ## 特徴

        - 正本はGit管理できるYAML。バージョン管理・レビュー・分岐がしやすい。
        - 閲覧はブラウザSPA。編集はブラウザ上、またはYAMLの直接編集のどちらも可能。
        - 静的サイトとして書き出せる（閲覧専用）。ホスティングや資料配布に使える。
        - 製品内にAIモデル・AIチャット・AI生成・AIレビューは組み込まない。
          外部AIがYAML／JSON／CLIを通常のファイルとして扱うことは妨げない。

        ## この資料の対象読者

        この利用ガイドは次の二種類の読者を対象とする。

        - **導入・運用者**（CLIで初期化・起動し、静的サイトや自己ホストを運用する人）
        - **利用者**（ブラウザ上で文書を閲覧する人、YAML／リッチテキストで文書を執筆する人）

        製品を組み込むための公開ライブラリSDKは現段階では提供していないため、
        パッケージ内部を利用する開発者向けの記述は含めない。

