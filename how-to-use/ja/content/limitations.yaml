spec:
  documentType: guide
  locale: ja
  blocks:
    - id: limitations
      type: rich-text
      format: commonmark
      content: |
        ## 位置づけ

        本ガイドは現在の実装を対象とする。ここでは、現段階で**利用できること**と、
        まだ**利用できないこと（今後の範囲）**を区別して示す。

        ## 現段階で利用できること

        - CLIの4コマンド: `init`・`dev`・`validate`・`build`（[CLIリファレンス](#page=cli-reference)）
        - ブラウザの初期セットアップ（[ブラウザ画面の使い方](#page=browser-guide)）
        - ブラウザ上の閲覧・アウトライン・ツリー・パンくず
        - ブラウザ上の編集と保存（ローカルYAMLへ書き戻し）
        - 全文検索（動的版）
        - 新規作成・名称変更・移動・アーカイブ・並べ替え（構造編集）
        - 閲覧専用の静的サイト生成と配信（[静的配信と自己ホスト](#page=self-hosting)）
        - 本文ブロックは`rich-text`（CommonMark）（[文書の書き方（YAML）](#page=authoring)）

        ## 現段階では利用できないこと（今後の範囲）

        次の機能はまだ実装されておらず、「利用可能」ではない。今後の拡張として扱う。

        - プラグイン／plugin SDK（設定の`plugins`は空配列のみ）
        - 差分表示
        - Vellymからのgit操作
        - `rich-text`以外の追加ブロック
        - preset

        ## 製品の方針

        - Vellym製品内には、AIモデル・AIチャット・AI生成・AIレビューを**組み込まない**。
          外部AIエージェントがYAML・JSON・CLIを通常のファイルとして扱うことは、これとは別で、妨げない。
        - 文書の唯一の正本はGit管理できるYAMLであり、HTMLや静的サイトは生成物である。

        ## 既知の注意点

        - 静的サイトは`file://`では表示できない。必ずHTTPで配信する（[静的配信と自己ホスト](#page=self-hosting)）。
        - `dev`は既定で`127.0.0.1`にバインドする。外部公開時は公開範囲に注意する。
        - Dockerイメージのレジストリ公開・バージョン固定・更新手順は未確定。
        - `v1alpha1`から`v1`への明示的migrationは利用できるが、正式な`v1`契約はRCまで変更される可能性がある。

        ## 関連

        - 全体像 → [Vellymとは](#page=overview)
        - コマンド → [CLIリファレンス](#page=cli-reference)
