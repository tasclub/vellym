apiVersion: vellym.tasclub.com/v1alpha1
kind: Page
metadata:
  name: concepts
  title: 用語と基本概念
spec:
  documentType: guide
  locale: ja
  blocks:
    - id: concepts
      type: rich-text
      format: commonmark
      content: |
        ## 正本と生成物

        - **正本（source of truth）**: 文書の唯一の原本。VellymではGit管理できる
          YAMLファイルが正本である。
        - **生成物**: 正本から作られる派生物。ブラウザ表示や静的サイトのHTMLはすべて
          生成物であり、直接の編集対象ではない。

        矛盾が生じた場合は常に正本（YAML）を優先する。

        ## Page・Block・Folder

        - **Page**: 一つのYAMLファイルが一つのPageに対応する。`kind: Page`で表す。
          タイトルや種別などの`metadata`と、本文にあたる`blocks`を持つ。
        - **Block**: Pageの本文を構成する要素。現在の実装で利用できるのは
          `rich-text`ブロック（Markdown／CommonMark記法）である。
        - **Folder**: ディレクトリを表す。`_index.yaml`（`kind: Folder`）で、その
          ディレクトリ内のページ・サブフォルダの**表示順**を定義する。

        Pageの具体的な書き方は[文書の書き方（YAML）](#page=authoring)を参照。

        ## contentRoot

        **contentRoot**は、正本YAMLを置くルートディレクトリである。
        設定ファイル`vellym.config.yaml`の`contentRoot`で指定する。Vellymは
        このディレクトリ配下のYAMLを読み込んで文書ツリーを構成する。詳細は
        [設定ファイル](#page=configuration)を参照。

        ## 動的版（dev）と静的版（build）

        Vellymには文書を扱う二つのモードがある。

        - **動的版（`vellym dev`）**: ローカルでサーバーを起動し、ブラウザ上で
          閲覧・編集・検索・構造編集ができる。保存内容はローカルのYAMLへ書き戻される。
        - **静的版（`vellym build`）**: 正本から**閲覧専用**の静的サイトを書き出す。
          編集・保存・検索・構成管理・設定は含まれない。ホスティングや資料配布に使う。

        コマンドの詳細は[CLIリファレンス](#page=cli-reference)、静的配信は[静的配信と自己ホスト](#page=self-hosting)を参照。

        ## ロケール（locale）

        - 各Pageは`spec.locale`に自身の言語（`ja`／`en`）を持つ。
        - ブラウザSPAの表示言語は、設定ファイルの`ui.language`で一つだけ選ぶ。
          一つのビルドは一つの言語で表示される。

        このため、日本語と英語を併記する場合は、言語ごとに独立したVellym
        プロジェクトを用意するのが素直である（本ガイド自体も`ja`／`en`を分けている）。

        ## 内部リンク

        本文中で他のPageへリンクするには、標準のMarkdownリンクで参照先を
        `#page=<slug>`と指定する。`slug`は参照先Pageの`metadata.slug`で、未設定時は
        `metadata.name`が使われる。例えばこのページからCLIリファレンスへは
        `[CLIリファレンス](#page=cli-reference)`と書く。

