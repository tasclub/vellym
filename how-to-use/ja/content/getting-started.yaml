      content: |
        ## 前提

        - **Node.js 22または24** と **npm**。
        - Node.jsをホストへ導入したくない場合は、Dockerを使う方法もある（[静的配信と自己ホスト](#page=self-hosting)）。

        以下は、開発リポジトリ内の生成済みCLI（`packages/vellym/dist/cli.mjs`）を
        直接呼び出す例で示す。配布物のCLIでは`vellym`コマンドとして実行できる。

        ## 最短の流れ

        1. **プロジェクトを初期化する**（対話形式）

           ```bash
           npx vellym@alpha init
           ```

           言語、content root、初期profile、作成する文書を対話で選ぶと、`vellym.config.yaml`
           と初期文書のYAMLが作成される。非対話で実行する場合の指定は[CLIリファレンス](#page=cli-reference)を参照。

        2. **開発サーバーを起動する**

           ```bash
           npx vellym@alpha dev
           ```

           既定で `http://127.0.0.1:4173` にバインドする。起動時に表示されるURLを
           ブラウザで開く。

        3. **ブラウザで閲覧・編集する**

           文書ツリー、アウトライン、検索、編集、構造編集が使える。画面操作は
           [ブラウザ画面の使い方](#page=browser-guide)を参照。

        ## 設定ファイルなしで始める

        `vellym.config.yaml`が無いディレクトリで`vellym dev`を起動すると、
        ブラウザ上の**初期セットアップ**が表示される。画面の案内に従って言語・保存先・
        文書構成を選ぶと、そのまま同じサーバーで文書ワークスペースへ切り替わる。
        セットアップ画面の流れは[ブラウザ画面の使い方](#page=browser-guide)を参照。

        設定ファイルが存在するが壊れている場合は、上書きせず設定エラーとして表示する。

        ## 検証する

        文書のスキーマや参照に問題がないかを確認するには：

        ```bash
        vellym validate
        ```

        ページ数と診断（エラー・警告）の一覧を表示する。詳細は[CLIリファレンス](#page=cli-reference)を参照。

        ## 配布・資料化する

        閲覧専用の静的サイトを書き出すには：

        ```bash
        vellym build
        ```

        生成物の配信手順と注意点は[静的配信と自己ホスト](#page=self-hosting)を参照。

