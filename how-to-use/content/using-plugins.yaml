apiVersion: vellym.tasclub.com/v1
kind: Page
metadata:
  name: using-plugins
  title: プラグインを使う
spec:
  locale: ja
  blocks:
    - id: using-plugins
      type: rich-text
      content: |
        Trackerの `spec.summary` に `{ field: priority, method: breakdown }` を配列で指定する。一覧では絞り込み後の全行を集計し、型が合わない値は除外件数を示す。WBSでは折りたたみ中・要確認を含む表示対象の全チケットを集計する。静的出力でも表示する。`spec.kanban.summary` があればカンバンではそちらを優先する。

        `{ field: estimate, method: sum, groupBy: sprint }` のように値ごとの集計もできる。`groupBy` は select・multiselect・reference・text の項目ID。未設定はまとめ、multiselect は各値に重複計上する。

        ## プラグインを追加する

        Vellymプロジェクトのルートで、使いたいプラグインをnpmパッケージとして
        インストールする。公式のチケット管理を使う場合は次のとおり。

        ```bash
        npm install @vellym/tickets
        ```

        次に、`vellym.config.yaml`の`plugins`へパッケージ名を追加する。

        ```yaml
        plugins:
          - "@vellym/tickets"
        ```

        複数使う場合は同じ配列へ一つずつ並べる。Vellymは設定ファイルの場所を起点に
        パッケージを探すため、そのプロジェクトへインストールする。

        ## カンバンを使う

        チケット管理にカンバン表示を追加するには、同じプロジェクトへ
        `@vellym/kanban`をインストールし、プラグインに追加する。

        ```bash
        npm install @vellym/kanban
        ```

        ```yaml
        plugins:
          - "@vellym/tickets" # 一覧も使う場合。カンバンだけなら省略できる
          - "@vellym/kanban"
        ```

        新しいリソースは作らない。既存の`TicketTracker`を開くと、カンバンだけなら
        カンバンが表示され、`@vellym/tickets`も有効なら一覧とカンバンを切り替えられる。
        Trackerの`spec.kanban`は任意で、カードに出す項目や列ごとの集計、並び順に使う数値項目を
        指定できる。列はTrackerのstatus定義順で、未設定値・定義外の値も表示する。
        集計の種類、カード項目、手動並べ替えの設定例は`@vellym/kanban`のREADMEを参照。

        設定ファイルのほかの項目は[[configuration|設定ファイル]]を参照。

        ## プラグインを外す

        `plugins`からパッケージ名を削除すると、そのプラグインの一覧、専用画面、操作が
        表示されなくなる。不要なら、その後npmパッケージも削除できる。

        ```bash
        npm uninstall @vellym/tickets
        ```

        プラグインを外しても、そのプラグインが扱っていたYAMLをVellymが削除したり
        書き換えたりすることはない。対応するプラグインがない`kind`は専用の解釈をせず、
        文書ツリーには表示しない。これはエラーではなく、共通部分の本文は全文検索と
        内部リンクから引き続き利用できる。

        ## 関連

        - 公式プラグイン一覧 → [[official-plugins|公式プラグイン]]
        - 公式チケット管理 → [[ticket-management|チケット管理]]
        - プラグイン開発の入口 → [[developing-plugins|プラグインを作る]]
        - 設計で迷う点 → [[plugin-design-notes|プラグイン設計で迷う点]]
  translations:
    en:
      visibility: published
      title: Using Plugins
      blocks:
        - id: using-plugins
          type: rich-text
          content: |
            Configure `spec.summary` as an array, e.g. `{ field: priority, method: breakdown }`. The list summarizes all filtered rows and reports invalid values, including in static output. WBS summarizes all its tickets, including collapsed and attention-needed rows. Kanban prefers `spec.kanban.summary` when present.

            Group an aggregate by a field with `{ field: estimate, method: sum, groupBy: sprint }`. The group field must be select, multiselect, reference, or text. Missing values form one group; multiselect values count in every matching group.

            ## Add a plugin

            From the Vellym project root, install the plugin as an npm package. For the
            official ticket manager, run:

            ```bash
            npm install @vellym/tickets
            ```

            Then add the package name to `plugins` in `vellym.config.yaml`:

            ```yaml
            plugins:
              - "@vellym/tickets"
            ```

            List each package separately when using more than one. Vellym resolves packages
            from the config file's location, so install them in that project.

            ## Add a Kanban view

            Install `@vellym/kanban` in the same project and list it under `plugins`:

            ```bash
            npm install @vellym/kanban
            ```

            ```yaml
            plugins:
              - "@vellym/tickets" # Optional; omit this if you only need the Kanban
              - "@vellym/kanban"
            ```

            It uses the existing `TicketTracker`; it does not add a separate resource. Opening a
            tracker shows the Kanban when it is the only ticket plugin. With `@vellym/tickets`
            enabled, switch between the list and Kanban views. `spec.kanban` is optional and can
            declare card fields, per-column summaries, and a numeric field for manual ordering.
            Columns follow the tracker's status order; unset and unknown statuses remain visible.
            See the `@vellym/kanban` README for summary methods and configuration examples.

            See [[configuration|Configuration File]] for the other settings.

            ## Remove a plugin

            Removing a package name from `plugins` removes that plugin's lists, dedicated
            screens, and actions. You can then remove the npm package if it is no longer needed:

            ```bash
            npm uninstall @vellym/tickets
            ```

            Removing a plugin never deletes or rewrites the YAML it handled. A `kind` with no
            matching plugin is no longer interpreted or shown in the document tree. This is
            not an error: its common body remains available to full-text search and internal
            links.

            ## Related

            - Official plugin list → [[official-plugins|Official Plugins]]
            - Official ticket management → [[ticket-management|Ticket Management]]
            - Start developing a plugin → [[developing-plugins|Developing Plugins]]
            - Design decisions and pitfalls → [[plugin-design-notes|Plugin Design Notes]]
