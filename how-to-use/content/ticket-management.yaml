apiVersion: vellym.tasclub.com/v1
kind: Page
metadata:
  name: ticket-management
  title: チケット管理
spec:
  locale: ja
  blocks:
    - id: ticket-management
      type: rich-text
      content: |
        CLIのTicket索引キーは`status`・`tracker`・`trackers`・`labels`・`field:<項目ID>`・`statusCategory`（`open`・`closed`。Trackerの`statuses`定義から引く分類で、状態が未定義なら値は無い）。`vellym list --kind Ticket --where status=ready --json`や`vellym list --kind Ticket --where field:priority=high`で読み取り専用に検索できる。`_`配下はTracker一覧から除外されるが、CLIは読み込んだ全Ticketを出す。`_`配下は索引行がなく`values`は空、その他の所属のないTicketは`values.tracker`が空文字列となる。
        例えば`vellym list --kind Ticket --json`の`values`から`field:dependsOn`と`statusCategory`を読めば、外部のスクリプトが`vellym list`だけで「依存先のTicketがすべて完了したか」を判定できる。

        ## はじめる

        先に`@vellym/tickets`をインストールして有効にする。手順は
        [[using-plugins|プラグインを使う]]を参照。

        `vellym dev`の文書ツリーで、管理したい工程のフォルダにある追加メニューから
        「チケット管理」を選ぶ。たとえば開発、テスト、リリース準備の各フォルダへ
        一つずつ置けば、工程ごとに別のチケット管理を持てる。
        Ticket管理テンプレートの一覧と追加方法は[[templates|テンプレートとセット]]を参照。

        ## 所属は置き場所で決まる

        `TicketTracker`は、置いたフォルダとその子孫のチケットを対象にする。チケットの
        YAMLに所属先を書く必要はない。上位に複数のTrackerがある場合は、最も近い祖先の
        Trackerがそのチケットを所有し、ステータスと項目の定義を与える。さらに上位の
        Trackerの一覧にも同じチケットが表示される。

        一覧から「チケットを作成」を選ぶと、新しいチケットは既定で
        `<Trackerのフォルダ>/+tickets/`へ保存される。

        ## ステータスと項目を定義する

        Trackerを開き、「このチケット管理の設定」から定義する。

        - **ステータス**: ID、表示名、未完了／完了の区分と並び順を決める。先頭の
          ステータスが新しいチケットの初期値になる。
        - **項目**: ID、表示名、型、必須かどうか、一覧へ列として出すかを決める。
          単一選択と複数選択には選択肢も定義する。

        定義と既存チケットの値が食い違っても、すべて警告として表示される。チケットは
        読み取りと編集を続けられ、定義から外れた値も勝手に削除されない。

        ## 条件ルール

        Trackerに条件を宣言すると違反は警告になり、保存は止めない。空は項目の欠如、null、空文字、空配列を指す。

        ```yaml
        spec:
          rules:
            - id: blocked-needs-reason
              when: { status: [blocked], statusCategory: open }
              require: [blockReason]
              equals: { nextAction: claude-research }
              empty: [activeRun]
              message: { ja: "理由を入力", en: "Enter a reason" }
        ```

        ## 一覧を使う

        一覧では、ステータス、一覧列にした項目、ラベルで絞り込める。列見出しから
        並べ替えられ、既定では完了に分類したステータスを除いて表示する。「未完了のみ」の
        切り替えを外すと完了分も確認できる。

        複数行を選ぶと、ステータスまたは単一選択の項目をまとめて変更できる。
        選んだチケットをまとめてアーカイブへ移すこともできる。

        ## 参照元と関連するコミット

        チケットの詳細には、次の2つの節が出る（読むときだけ）。

        - **このページを参照している**: 親（`parent`）や依存などの`reference`型の項目で、このチケットを指している
          チケットの一覧。項目名と状態が付き、押すとそのチケットを開ける。参照元が無ければ出ない
        - **関連するコミット**: コミットメッセージ（件名か本文）にこのチケットの名前（`metadata.name`、例:
          `ticket-01m6…`）をそのまま書いたコミットの一覧。リポジトリ全体が対象で、日時・作者・件名・短いhashが出る。
          名前の一部や別の名前の前方一致には当たらない。Gitが無いときは理由を出す。静的版には出ない

        ```text
        git commit -m "一覧の並べ替えを直す" -m "Refs: ticket-01m6sy034fzn60bv6ayw7sbg2n"
        ```

        ## `_`と`+`で始まるフォルダ

        - `+`で始まるフォルダは文書ツリーだけから隠す。中のチケットは一覧、全文検索、
          内部リンクに出る。既定の`+tickets/`はこの用途である。
        - `_`で始まるフォルダは文書ツリーに出ず、中のチケットをすべてのチケット一覧からも
          除外する。警告を出さずに保留しておきたいチケットに使う。全文検索と内部リンクからは
          引き続き到達できる。ただし、予約済みの`_archive/`はVellymの読み込み対象外になる。

        ## YAMLで直接書く

        チケットの正本はYAMLファイルである。画面を使わず、エディタや外部のAI
        エージェントから直接書いても、画面から作ったものと区別されない。

        ### TicketTracker

        フォルダ直下へ1ファイル置く。ファイル名は自由に決めてよい。

        ```yaml
        apiVersion: vellym.tasclub.com/v1
        kind: TicketTracker
        metadata:
          name: dev-tickets
          title: 開発チケット
        spec:
          statuses:
            - { id: todo, label: 未着手, category: open }
            - { id: doing, label: 対応中, category: open }
            - { id: done, label: 完了, category: closed }
          fields:
            - id: priority
              label: 優先度
              type: select
              required: true
              listColumn: true
              options:
                - { value: high, label: 高 }
                - { value: low, label: 低 }
            - id: due
              label: 期限
              type: date
              listColumn: true
        ```

        - `statuses[]`は`id`／`label`／`category`が必須。`category`は`open`と`closed`の
          2値だけで、他の値を書いたその要素は読み飛ばされる。
        - **配列の先頭が新規作成時の初期値**になり、配列順がそのまま表示順になる。
          初期値を指定するキーは無い。並べ替えて変える。
        - `select`項目の初期値は選択肢の先頭。新しいTicketの`blockReason`を`none`にするなら、
          `options`の先頭を`{ value: none, label: なし }`にする。
        - `fields[]`は`id`／`label`／`type`が必須。`required`と`listColumn`は省略すると
          `false`。
        - `required`は**画面から新しく作るときだけ**入力を強制する。既存チケットの編集も、
          手書きのYAMLも止めない。正本がファイルである以上、書き込みを塞ぐ手段は無い。
        - 一覧への参加は列（`listColumn`）・絞り込み（`filter`）・並べ替え（`sort`）を
          別々に宣言する。`filter`と`sort`を省略すると`listColumn`と同じになる。
          `listColumn`なしで`filter`か`sort`を宣言した項目は、表に列を出さないまま、
          絞り込みと並べ替えの選択だけに使える。
        - `spec.defaultSort: { field: <項目ID>, direction: asc|desc }`は一覧を開いたときの
          並べ替え。列に出していない項目でも、並べ替えを有効にしていれば指定できる。
          `direction`の省略時は`asc`。存在しない項目や並べ替えが無効な項目を指すと警告になり、
          一覧は今までどおりタイトルの昇順で開く。個人設定で並べ替えを変えた場合はそちらが優先される。

        ### 本文テンプレート

        Trackerの`spec.ticketTemplate`にCommonMark文字列を一つ指定すると、新規チケットの
        本文にコピーされる。省略時は空。言語別に書く場合、作成時の言語を選び、
        該当言語がなければ最初の値を使う。既存チケットは変更されない。

        ```yaml
        ticketTemplate:
          ja: "## 目的\n\n## 完了条件\n"
          en: "## Purpose\n\n## Acceptance criteria\n"
        ```

        言語別の代わりに`ticketTemplate: "## 目的"`のように文字列でも指定できる。

        ### Ticket

        Trackerのフォルダか、その子孫へ置く。既定の保存先は`<Trackerのフォルダ>/+tickets/`。

        ```yaml
        apiVersion: vellym.tasclub.com/v1
        kind: Ticket
        metadata:
          name: ticket-01m0mt7tx3dm5qe6xv0265ftqc
          title: 見出しの階層を3段までに整理する
          labels:
            area: editor
        spec:
          status: doing
          fields:
            priority: high
            due: 2026-09-05
          blocks:
            - id: description
              type: rich-text
              content: |
                アウトラインが深くなりすぎて、右の見出し一覧が読みにくい。
        ```

        - `spec.status`は所有Trackerの`statuses[].id`を指す。
        - `spec.fields`は**`fields[].id`をキーにしたmap**である。Trackerのような配列では
          ないことに注意する。
        - `spec.blocks`はPageと同じ形で、本文をここへ書く。
        - `metadata.labels`は`kind`に依存しない分類軸で、一覧の絞り込みに使える。
          Trackerの`fields`とは別のものである。
        - `metadata.name`は小文字英数と`-`。画面が作るチケットは
          `ticket-<小文字ULID>`で、ファイル名も同じにする。手書きでも揃えておくと、
          ファイルがおおよそ作成順に並び、Gitの差分が読みやすい。

        ### 項目の型と値の書き方

        | `type` | YAMLでの値 |
        | --- | --- |
        | `text` | 文字列 |
        | `multiline` | 文字列。複数行はYAMLのブロックスカラーで書く |
        | `number` | 数値。`"3"`のような文字列は型違いの警告になる |
        | `boolean` | `true`／`false` |
        | `date` | `2026-09-05`形式の文字列。他の書式は警告になる |
        | `select` | `options[].value`のいずれかと一致する文字列 |
        | `multiselect` | 文字列の配列。`- { }`ではなく`[a, b]`または`- a` |
        | `reference` | 文字列。`multiple: true`を付けると文字列の配列 |

        識別子は**`multiselect`であり、`multi-select`ではない**。

        `reference`の項目には、項目定義へ`multiple: true`を足すと複数のTicketを格納できる。
        値は参照の配列になり、一覧・検索・並び替え・集計は`multiselect`と同じ扱いになる
        （件数は値の個数を表示し、並び替えは配列の先頭の値を使う）。型に合わない値も
        警告として残る。詳細画面ではTicket名のカンマ区切りとして編集し、名称を並べて表示する。
        `reference`の値は、同じ`TicketTracker`に属するTicketの`metadata.name`である。
        存在しない名前は`validate`で`TICKET_REFERENCE_UNRESOLVED`警告になる。
        `multiple: true`ならTicket名の配列を書く。
        `multiple: true`を付けた項目は、階層の設定で「親を指す参照項目」に選べない
        （`TICKET_PARENT_FIELD_INVALID`として報告される）。

        型に合わない値も、Vellymは削除せず警告として表示する。定義を1つ変えただけで
        大量のチケットが編集不能になるのを避けるためである。
        `select`や`multiselect`の選択肢にない値も警告され、値は保持される。

        機械検証には
        <https://vellym.tasclub.com/schemas/v1/ticket.schema.json> と
        <https://vellym.tasclub.com/schemas/v1/ticket-tracker.schema.json> を使える。

        ## 関連

        - プラグインの追加と削除 → [[using-plugins|プラグインを使う]]
        - PageのYAMLの書き方 → [[authoring|文書の書き方（YAML）]]
  translations:
    en:
      visibility: published
      title: Ticket Management
      blocks:
        - id: ticket-management
          type: rich-text
          content: |
            Ticket index keys are `status`, `tracker`, `trackers`, `labels`, `field:<id>`, and `statusCategory` (`open` or `closed`, taken from the tracker's `statuses` definition; absent for undefined statuses). Query read-only with `vellym list --kind Ticket --where status=ready --json` or `vellym list --kind Ticket --where field:priority=high`. Tickets under `_` are excluded from tracker lists but the CLI includes all loaded tickets; these have empty `values`, while other tickets without an owner have an empty `values.tracker`.
            For example, reading `field:dependsOn` and `statusCategory` from the `values` of `vellym list --kind Ticket --json` lets an external script decide whether every dependency of a ticket is done using `vellym list` alone.

            ## Get started

            Install and enable `@vellym/tickets` first. See
            [[using-plugins|Using Plugins]] for the steps.

            In the `vellym dev` document tree, open the add menu on the folder for the stage
            you want to manage and choose "Ticket tracker." Place one in each of your
            development, testing, and release-preparation folders to manage those stages
            separately.
            See [[templates|Templates and Sets]] for the ticket-management template catalog and how to add one.

            ## Location determines ownership

            A `TicketTracker` covers tickets in its folder and descendants. There is no need
            to name an owner in each ticket's YAML. When more than one Tracker is above a
            ticket, the nearest ancestor owns it and supplies its status and field definitions.
            The same ticket also appears in the lists of Trackers farther up the hierarchy.

            Choosing "New ticket" from a list saves the new ticket under
            `<Tracker folder>/+tickets/` by default.

            ## Conditional rules

            Declare rules on the tracker to show warnings without preventing saving. Empty means missing, null, an empty string, or an empty array.

            ```yaml
            spec:
              rules:
                - id: blocked-needs-reason
                  when: { status: [blocked], statusCategory: open }
                  require: [blockReason]
                  equals: { nextAction: claude-research }
                  empty: [activeRun]
                  message: { ja: "理由を入力", en: "Enter a reason" }
            ```

            ## Define statuses and fields

            Open the Tracker and choose "Tracker settings."

            - **Statuses**: set the ID, label, open/closed category, and order. The first
              status is the initial value for a new ticket.
            - **Fields**: set the ID, label, type, whether it is required, and whether it is
              a list column. Define options for select and multi-select fields.

            Mismatches between the definitions and existing ticket values are all reported as
            warnings. Tickets remain readable and editable, and values removed from a
            definition are not silently deleted.

            ## Work with the list

            Filter the list by status, fields enabled as list columns, or labels. Sort from a
            column heading. By default, statuses categorized as closed are hidden; clear the
            "Open only" toggle to include them.

            Select multiple rows to change their status or a single-select field together.
            You can also move the selected tickets to the archive in one operation.

            ## Referenced by and related commits

            A ticket's detail shows two more sections while reading:

            - **Referenced by**: tickets whose `reference` fields, such as the parent or dependencies,
              point at this one, with the field name and state. Press one to open it. Hidden when none
            - **Related commits**: commits whose message (subject or body) contains this ticket's name
              (`metadata.name`, for example `ticket-01m6…`) exactly, anywhere in the repository, with
              date, author, subject, and a short hash. Parts of the name or longer names that start
              with it do not match. Without Git, the reason is shown. Not shown on the static site

            ```text
            git commit -m "Fix list sorting" -m "Refs: ticket-01m6sy034fzn60bv6ayw7sbg2n"
            ```

            ## Folders beginning with `_` and `+`

            - A folder beginning with `+` is hidden only from the document tree. Its tickets
              remain in ticket lists, full-text search, and internal links. The default
              `+tickets/` folder uses this behavior.
            - A folder beginning with `_` is hidden from the document tree and its tickets are
              excluded from every ticket list. Use it to hold tickets silently without
              warnings. They remain reachable through full-text search and internal links.
              The reserved `_archive/` folder is the exception and is not loaded by Vellym.

            ## Writing the YAML directly

            A ticket's canonical form is a YAML file. Writing one directly from an editor or
            an external AI agent produces the same thing as creating it from the screen.

            ### TicketTracker

            Place one file directly in the folder. The file name is yours to choose.

            ```yaml
            apiVersion: vellym.tasclub.com/v1
            kind: TicketTracker
            metadata:
              name: dev-tickets
              title: Development tickets
            spec:
              statuses:
                - { id: todo, label: To do, category: open }
                - { id: doing, label: In progress, category: open }
                - { id: done, label: Done, category: closed }
              fields:
                - id: priority
                  label: Priority
                  type: select
                  required: true
                  listColumn: true
                  options:
                    - { value: high, label: High }
                    - { value: low, label: Low }
                - id: due
                  label: Due
                  type: date
                  listColumn: true
            ```

            - `statuses[]` requires `id`, `label`, and `category`. `category` accepts only
              `open` and `closed`; an entry with any other value is skipped.
            - **The first entry is the initial value** for a new ticket, and array order is
              display order. There is no key for declaring a default. Reorder to change it.
            - A `select` field uses its first option as the initial value. To start new tickets
              with `blockReason: none`, put `{ value: none, label: None }` first in `options`.
            - `fields[]` requires `id`, `label`, and `type`. `required` and `listColumn`
              default to `false`.
            - `required` is enforced **only when creating from the screen**. It blocks neither
              editing an existing ticket nor hand-written YAML. While files are the canonical
              form, there is no way to prevent a write.
            - Joining the list view is declared per axis: column (`listColumn`), filter
              (`filter`), and sort (`sort`). Omitting `filter` or `sort` follows `listColumn`.
              A field with `filter` or `sort` but no `listColumn` stays out of the table while
              the filter and sort selectors offer it.
            - `spec.defaultSort: { field: <field-id>, direction: asc|desc }` sets the sort used
              when the list opens. A field outside the columns works as long as its sorting is
              enabled. `direction` defaults to `asc`. An unknown field or one with sorting
              disabled raises a warning, and the list opens sorted by title as before. Personal
              settings override the default.

            ### Body template

            Set one CommonMark string in the Tracker's `spec.ticketTemplate` to copy it into
            each new ticket's body. Without it the body is empty. A localized map selects the
            creation language, falling back to its first value; existing tickets are unchanged.

            ```yaml
            ticketTemplate:
              ja: "## 目的\n\n## 完了条件\n"
              en: "## Purpose\n\n## Acceptance criteria\n"
            ```

            A single string such as `ticketTemplate: "## Purpose"` also works.

            ### Ticket

            Place it in the Tracker's folder or below it. The default location is
            `<Tracker folder>/+tickets/`.

            ```yaml
            apiVersion: vellym.tasclub.com/v1
            kind: Ticket
            metadata:
              name: ticket-01m0mt7tx3dm5qe6xv0265ftqc
              title: Limit the heading hierarchy to three levels
              labels:
                area: editor
            spec:
              status: doing
              fields:
                priority: high
                due: 2026-09-05
              blocks:
                - id: description
                  type: rich-text
                  content: |
                    The outline runs too deep, making the heading list hard to read.
            ```

            - `spec.status` refers to a `statuses[].id` of the owning Tracker.
            - `spec.fields` is a **map keyed by `fields[].id`**. Note that it is not an array
              like the Tracker's definition.
            - `spec.blocks` takes the same form as a Page. Write the body here.
            - `metadata.labels` is a kind-independent classification usable for filtering the
              list. It is separate from a Tracker's `fields`.
            - `metadata.name` is lowercase alphanumerics and `-`. Tickets created from the
              screen use `ticket-<lowercase ULID>` with a matching file name. Following that
              by hand keeps files in roughly creation order and Git diffs readable.

            ### Field types and their values

            | `type` | Value in YAML |
            | --- | --- |
            | `text` | string |
            | `multiline` | string; use a YAML block scalar for multiple lines |
            | `number` | number. A string such as `"3"` raises a type warning |
            | `boolean` | `true` / `false` |
            | `date` | string in `2026-09-05` form. Other formats raise a warning |
            | `select` | string matching one of `options[].value` |
            | `multiselect` | array of strings |
            | `reference` | string; with `multiple: true`, an array of strings |

            The identifier is **`multiselect`, not `multi-select`**.

            A `reference` field can hold several tickets by adding `multiple: true` to the
            field definition. Its value is an array of references, and lists, searches,
            sorting and summaries treat it like a `multiselect` field (counts show the
            number of values, and sorting uses the first value of the array). Values that
            do not match the type are kept as warnings. The detail screen edits the array
            as a comma-separated list of ticket names and displays the names side by side.
            A `reference` value is the `metadata.name` of a ticket in the same `TicketTracker`.
            A name that does not exist there produces the `TICKET_REFERENCE_UNRESOLVED` warning
            during `validate`. With `multiple: true`, write an array of ticket names.
            A field with `multiple: true` cannot be chosen as the parent reference field
            in the hierarchy settings (`TICKET_PARENT_FIELD_INVALID`).

            Values that do not match the type are reported as warnings, never removed. This
            keeps one edit to a definition from making a large number of tickets uneditable.
            Values outside the defined `select` or `multiselect` options also produce warnings
            and are retained.

            For machine validation, use
            <https://vellym.tasclub.com/schemas/v1/ticket.schema.json> and
            <https://vellym.tasclub.com/schemas/v1/ticket-tracker.schema.json>.

            ## Related

            - Adding and removing plugins → [[using-plugins|Using Plugins]]
            - Writing Page YAML → [[authoring|Authoring Documents (YAML)]]
