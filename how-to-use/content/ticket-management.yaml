apiVersion: vellym.tasclub.com/v1
kind: Page
metadata:
  name: ticket-management
  title: チケット管理
spec:
  locale: ja
  blocks:
    - id: ticket-management
      type: rich-text
      content: |
        ## はじめる

        先に`@vellym/tickets`をインストールして有効にする。手順は
        [[using-plugins|プラグインを使う]]を参照。

        `vellym dev`の文書ツリーで、管理したい工程のフォルダにある追加メニューから
        「チケット管理」を選ぶ。たとえば開発、テスト、リリース準備の各フォルダへ
        一つずつ置けば、工程ごとに別のチケット管理を持てる。

        ## 所属は置き場所で決まる

        `TicketTracker`は、置いたフォルダとその子孫のチケットを対象にする。チケットの
        YAMLに所属先を書く必要はない。上位に複数のTrackerがある場合は、最も近い祖先の
        Trackerがそのチケットを所有し、ステータスと項目の定義を与える。さらに上位の
        Trackerの一覧にも同じチケットが表示される。

        一覧から「チケットを作成」を選ぶと、新しいチケットは既定で
        `<Trackerのフォルダ>/+tickets/`へ保存される。

        ## ステータスと項目を定義する

        Trackerを開き、「このチケット管理の設定」から定義する。

        - **ステータス**: ID、表示名、未完了／完了の区分と並び順を決める。先頭の
          ステータスが新しいチケットの初期値になる。
        - **項目**: ID、表示名、型、必須かどうか、一覧へ列として出すかを決める。
          単一選択と複数選択には選択肢も定義する。

        定義と既存チケットの値が食い違っても、すべて警告として表示される。チケットは
        読み取りと編集を続けられ、定義から外れた値も勝手に削除されない。

        ## 一覧を使う

        一覧では、ステータス、一覧列にした項目、ラベルで絞り込める。列見出しから
        並べ替えられ、既定では完了に分類したステータスを除いて表示する。「未完了のみ」の
        切り替えを外すと完了分も確認できる。

        複数行を選ぶと、ステータスまたは単一選択の項目をまとめて変更できる。
        選んだチケットをまとめてアーカイブへ移すこともできる。

        ## `_`と`+`で始まるフォルダ

        - `+`で始まるフォルダは文書ツリーだけから隠す。中のチケットは一覧、全文検索、
          内部リンクに出る。既定の`+tickets/`はこの用途である。
        - `_`で始まるフォルダは文書ツリーに出ず、中のチケットをすべてのチケット一覧からも
          除外する。警告を出さずに保留しておきたいチケットに使う。全文検索と内部リンクからは
          引き続き到達できる。ただし、予約済みの`_archive/`はVellymの読み込み対象外になる。

        ## YAMLで直接書く

        チケットの正本はYAMLファイルである。画面を使わず、エディタや外部のAI
        エージェントから直接書いても、画面から作ったものと区別されない。

        ### TicketTracker

        フォルダ直下へ1ファイル置く。ファイル名は自由に決めてよい。

        ```yaml
        apiVersion: vellym.tasclub.com/v1
        kind: TicketTracker
        metadata:
          name: dev-tickets
          title: 開発チケット
        spec:
          statuses:
            - { id: todo, label: 未着手, category: open }
            - { id: doing, label: 対応中, category: open }
            - { id: done, label: 完了, category: closed }
          fields:
            - id: priority
              label: 優先度
              type: select
              required: true
              listColumn: true
              options:
                - { value: high, label: 高 }
                - { value: low, label: 低 }
            - id: due
              label: 期限
              type: date
              listColumn: true
        ```

        - `statuses[]`は`id`／`label`／`category`が必須。`category`は`open`と`closed`の
          2値だけで、他の値を書いたその要素は読み飛ばされる。
        - **配列の先頭が新規作成時の初期値**になり、配列順がそのまま表示順になる。
          初期値を指定するキーは無い。並べ替えて変える。
        - `fields[]`は`id`／`label`／`type`が必須。`required`と`listColumn`は省略すると
          `false`。
        - `required`は**画面から新しく作るときだけ**入力を強制する。既存チケットの編集も、
          手書きのYAMLも止めない。正本がファイルである以上、書き込みを塞ぐ手段は無い。

        ### Ticket

        Trackerのフォルダか、その子孫へ置く。既定の保存先は`<Trackerのフォルダ>/+tickets/`。

        ```yaml
        apiVersion: vellym.tasclub.com/v1
        kind: Ticket
        metadata:
          name: ticket-01m0mt7tx3dm5qe6xv0265ftqc
          title: 見出しの階層を3段までに整理する
          labels:
            area: editor
        spec:
          status: doing
          fields:
            priority: high
            due: 2026-09-05
          blocks:
            - id: description
              type: rich-text
              content: |
                アウトラインが深くなりすぎて、右の見出し一覧が読みにくい。
        ```

        - `spec.status`は所有Trackerの`statuses[].id`を指す。
        - `spec.fields`は**`fields[].id`をキーにしたmap**である。Trackerのような配列では
          ないことに注意する。
        - `spec.blocks`はPageと同じ形で、本文をここへ書く。
        - `metadata.labels`は`kind`に依存しない分類軸で、一覧の絞り込みに使える。
          Trackerの`fields`とは別のものである。
        - `metadata.name`は小文字英数と`-`。画面が作るチケットは
          `ticket-<小文字ULID>`で、ファイル名も同じにする。手書きでも揃えておくと、
          ファイルがおおよそ作成順に並び、Gitの差分が読みやすい。

        ### 項目の型と値の書き方

        | `type` | YAMLでの値 |
        | --- | --- |
        | `text` | 文字列 |
        | `multiline` | 文字列。複数行はYAMLのブロックスカラーで書く |
        | `number` | 数値。`"3"`のような文字列は型違いの警告になる |
        | `boolean` | `true`／`false` |
        | `date` | `2026-09-05`形式の文字列。他の書式は警告になる |
        | `select` | `options[].value`のいずれかと一致する文字列 |
        | `multiselect` | 文字列の配列。`- { }`ではなく`[a, b]`または`- a` |
        | `reference` | 文字列 |

        識別子は**`multiselect`であり、`multi-select`ではない**。

        型に合わない値も、Vellymは削除せず警告として表示する。定義を1つ変えただけで
        大量のチケットが編集不能になるのを避けるためである。

        機械検証には
        <https://vellym.tasclub.com/schemas/v1/ticket.schema.json> と
        <https://vellym.tasclub.com/schemas/v1/ticket-tracker.schema.json> を使える。

        ## 関連

        - プラグインの追加と削除 → [[using-plugins|プラグインを使う]]
        - PageのYAMLの書き方 → [[authoring|文書の書き方（YAML）]]
  translations:
    en:
      visibility: published
      title: Ticket Management
      blocks:
        - id: ticket-management
          type: rich-text
          content: |
            ## Get started

            Install and enable `@vellym/tickets` first. See
            [[using-plugins|Using Plugins]] for the steps.

            In the `vellym dev` document tree, open the add menu on the folder for the stage
            you want to manage and choose "Ticket tracker." Place one in each of your
            development, testing, and release-preparation folders to manage those stages
            separately.

            ## Location determines ownership

            A `TicketTracker` covers tickets in its folder and descendants. There is no need
            to name an owner in each ticket's YAML. When more than one Tracker is above a
            ticket, the nearest ancestor owns it and supplies its status and field definitions.
            The same ticket also appears in the lists of Trackers farther up the hierarchy.

            Choosing "New ticket" from a list saves the new ticket under
            `<Tracker folder>/+tickets/` by default.

            ## Define statuses and fields

            Open the Tracker and choose "Tracker settings."

            - **Statuses**: set the ID, label, open/closed category, and order. The first
              status is the initial value for a new ticket.
            - **Fields**: set the ID, label, type, whether it is required, and whether it is
              a list column. Define options for select and multi-select fields.

            Mismatches between the definitions and existing ticket values are all reported as
            warnings. Tickets remain readable and editable, and values removed from a
            definition are not silently deleted.

            ## Work with the list

            Filter the list by status, fields enabled as list columns, or labels. Sort from a
            column heading. By default, statuses categorized as closed are hidden; clear the
            "Open only" toggle to include them.

            Select multiple rows to change their status or a single-select field together.
            You can also move the selected tickets to the archive in one operation.

            ## Folders beginning with `_` and `+`

            - A folder beginning with `+` is hidden only from the document tree. Its tickets
              remain in ticket lists, full-text search, and internal links. The default
              `+tickets/` folder uses this behavior.
            - A folder beginning with `_` is hidden from the document tree and its tickets are
              excluded from every ticket list. Use it to hold tickets silently without
              warnings. They remain reachable through full-text search and internal links.
              The reserved `_archive/` folder is the exception and is not loaded by Vellym.

            ## Writing the YAML directly

            A ticket's canonical form is a YAML file. Writing one directly from an editor or
            an external AI agent produces the same thing as creating it from the screen.

            ### TicketTracker

            Place one file directly in the folder. The file name is yours to choose.

            ```yaml
            apiVersion: vellym.tasclub.com/v1
            kind: TicketTracker
            metadata:
              name: dev-tickets
              title: Development tickets
            spec:
              statuses:
                - { id: todo, label: To do, category: open }
                - { id: doing, label: In progress, category: open }
                - { id: done, label: Done, category: closed }
              fields:
                - id: priority
                  label: Priority
                  type: select
                  required: true
                  listColumn: true
                  options:
                    - { value: high, label: High }
                    - { value: low, label: Low }
                - id: due
                  label: Due
                  type: date
                  listColumn: true
            ```

            - `statuses[]` requires `id`, `label`, and `category`. `category` accepts only
              `open` and `closed`; an entry with any other value is skipped.
            - **The first entry is the initial value** for a new ticket, and array order is
              display order. There is no key for declaring a default. Reorder to change it.
            - `fields[]` requires `id`, `label`, and `type`. `required` and `listColumn`
              default to `false`.
            - `required` is enforced **only when creating from the screen**. It blocks neither
              editing an existing ticket nor hand-written YAML. While files are the canonical
              form, there is no way to prevent a write.

            ### Ticket

            Place it in the Tracker's folder or below it. The default location is
            `<Tracker folder>/+tickets/`.

            ```yaml
            apiVersion: vellym.tasclub.com/v1
            kind: Ticket
            metadata:
              name: ticket-01m0mt7tx3dm5qe6xv0265ftqc
              title: Limit the heading hierarchy to three levels
              labels:
                area: editor
            spec:
              status: doing
              fields:
                priority: high
                due: 2026-09-05
              blocks:
                - id: description
                  type: rich-text
                  content: |
                    The outline runs too deep, making the heading list hard to read.
            ```

            - `spec.status` refers to a `statuses[].id` of the owning Tracker.
            - `spec.fields` is a **map keyed by `fields[].id`**. Note that it is not an array
              like the Tracker's definition.
            - `spec.blocks` takes the same form as a Page. Write the body here.
            - `metadata.labels` is a kind-independent classification usable for filtering the
              list. It is separate from a Tracker's `fields`.
            - `metadata.name` is lowercase alphanumerics and `-`. Tickets created from the
              screen use `ticket-<lowercase ULID>` with a matching file name. Following that
              by hand keeps files in roughly creation order and Git diffs readable.

            ### Field types and their values

            | `type` | Value in YAML |
            | --- | --- |
            | `text` | string |
            | `multiline` | string; use a YAML block scalar for multiple lines |
            | `number` | number. A string such as `"3"` raises a type warning |
            | `boolean` | `true` / `false` |
            | `date` | string in `2026-09-05` form. Other formats raise a warning |
            | `select` | string matching one of `options[].value` |
            | `multiselect` | array of strings |
            | `reference` | string |

            The identifier is **`multiselect`, not `multi-select`**.

            Values that do not match the type are reported as warnings, never removed. This
            keeps one edit to a definition from making a large number of tickets uneditable.

            For machine validation, use
            <https://vellym.tasclub.com/schemas/v1/ticket.schema.json> and
            <https://vellym.tasclub.com/schemas/v1/ticket-tracker.schema.json>.

            ## Related

            - Adding and removing plugins → [[using-plugins|Using Plugins]]
            - Writing Page YAML → [[authoring|Authoring Documents (YAML)]]
