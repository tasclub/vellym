apiVersion: vellym.tasclub.com/v1alpha1
kind: Page
metadata:
  name: getting-started
  title: はじめかた
spec:
  documentType: guide
  locale: ja
  blocks:
    - id: getting-started
      type: rich-text
      format: commonmark
      content: |
        ## 前提

        - **Node.js 22.12以降** と **npm**（22・24系で動作確認済み）。
        - Node.jsをホストへ導入したくない場合は、Dockerを使う方法もある（[[self-hosting|静的配信と自己ホスト]]）。

        以下は、開発リポジトリ内の生成済みCLI（`packages/vellym/dist/cli.mjs`）を
        直接呼び出す例で示す。配布物のCLIでは`vellym`コマンドとして実行できる。

        ## 最短の流れ

        1. **プロジェクトを初期化する**

           ```bash
           npx vellym@beta init myproject --size small-team --method hybrid --language ja
           ```

           規模と開発方式に応じた厳格構成のFolderとPage YAML、`vellym.config.yaml`が作成される。
           個別に選びながら始めたい場合は、初期化せずに`vellym dev`を起動し、ブラウザの3段階
           セットアップから開始する。指定できるオプションは[[cli-reference|CLIリファレンス]]を参照。

        2. **開発サーバーを起動する**

           ```bash
           npx vellym@beta dev
           ```

           既定で `http://127.0.0.1:4173` にバインドする。起動時に表示されるURLを
           ブラウザで開く。

        3. **ブラウザで閲覧・編集する**

           文書ツリー、アウトライン、検索、編集、構造編集が使える。画面操作は
           [[browser-guide|ブラウザ画面の使い方]]を参照。

        ## 設定ファイルなしで始める

        `vellym.config.yaml`が無いディレクトリで`vellym dev`を起動すると、
        ブラウザ上の**初期セットアップ**が表示される。画面の案内に従って言語・保存先・
        文書構成を選ぶと、そのまま同じサーバーで文書ワークスペースへ切り替わる。
        セットアップ画面の流れは[[browser-guide|ブラウザ画面の使い方]]を参照。

        設定ファイルが存在するが壊れている場合は、上書きせず設定エラーとして表示する。

        ## 検証する

        文書のスキーマや参照に問題がないかを確認するには：

        ```bash
        vellym validate
        ```

        ページ数と診断（エラー・警告）の一覧を表示する。詳細は[[cli-reference|CLIリファレンス]]を参照。

        ## 配布・資料化する

        閲覧専用の静的サイトを書き出すには：

        ```bash
        vellym build
        ```

        生成物の配信手順と注意点は[[self-hosting|静的配信と自己ホスト]]を参照。

        ## 関連

        - 用語の確認 → [[concepts|用語と基本概念]]
        - コマンド一覧 → [[cli-reference|CLIリファレンス]]
        - 設定ファイル → [[configuration|設定ファイル]]
  translations:
    en:
      visibility: published
      title: Getting Started
      blocks:
        - id: getting-started
          type: rich-text
          format: commonmark
          content: |
            ## Prerequisites

            - **Node.js 22.12 or later** and **npm** (verified on the 22 and 24 lines).
            - If you would rather not install Node.js on the host, there is a Docker path
              ([[self-hosting|Static Publishing and Self-Hosting]]).

            The examples below invoke the built CLI in the development repo
            (`packages/vellym/dist/cli.mjs`) directly. In a distributed build you run it as
            the `vellym` command.

            ## Shortest path

            1. **Initialize a project**

               ```bash
               npx vellym@beta init myproject --size small-team --method hybrid --language ja
               ```

               Writes `vellym.config.yaml` plus the strict folder and page hierarchy for the
               given size and method. To choose folders and pages individually instead, skip
               `init` and run `vellym dev` to use the three-step browser setup. See
               [[cli-reference|CLI Reference]] for the available options.

            2. **Start the dev server**

               ```bash
               npx vellym@beta dev
               ```

               Binds to `http://127.0.0.1:4173` by default. Open the URL printed at startup.

            3. **Read and edit in the browser**

               Document tree, outline, search, editing, and structure editing are available.
               See [[browser-guide|Using the Browser UI]].

            ## Start without a config file

            If you run `vellym dev` in a directory with no `vellym.config.yaml`, the
            in-browser **setup** appears. Follow it to choose language, location, and document
            structure; it then switches to the document workspace on the same server. The
            setup flow is described in [[browser-guide|Using the Browser UI]].

            If a config file exists but is broken, Vellym does not overwrite it and shows a
            config error instead.

            ## Validate

            To check documents for schema or reference problems:

            ```bash
            vellym validate
            ```

            It reports the page count and a list of diagnostics (errors / warnings). See
            [[cli-reference|CLI Reference]].

            ## Distribute as material

            To export a read-only static site:

            ```bash
            vellym build
            ```

            See [[self-hosting|Static Publishing and Self-Hosting]] for serving and caveats.

            ## Related

            - Check terminology → [[concepts|Terminology and Concepts]]
            - Command list → [[cli-reference|CLI Reference]]
            - Config file → [[configuration|Configuration File]]
