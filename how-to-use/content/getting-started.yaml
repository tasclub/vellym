apiVersion: vellym.tasclub.com/v1alpha1
kind: Page
metadata:
  name: getting-started
  title: はじめかた
spec:
  documentType: guide
  locale: ja
  blocks:
    - id: getting-started
      type: rich-text
      format: commonmark
      content: |
        ## 前提

        - **Node.js 22.12以降** と **npm**（22・24系で動作確認済み）。
        - Node.jsをホストへ導入したくない場合は、Dockerを使う方法もある（[[self-hosting|静的配信と自己ホスト]]）。

        以下は、開発リポジトリ内の生成済みCLI（`packages/vellym/dist/cli.mjs`）を
        直接呼び出す例で示す。配布物のCLIでは`vellym`コマンドとして実行できる。

        ## 最短の流れ

        1. **プロジェクトを初期化する**

           ```bash
           npx vellym@beta init myproject --size small-team --method hybrid --language ja
           ```

           規模と開発方式に応じた標準の構成（`--level`で`light`・`strict`も選べる）のFolderとPage YAML、`vellym.config.yaml`が作成される。実行した`vellym`の版も`package.json`の`devDependencies`に記録される。
           個別に選びながら始めたい場合は、初期化せずに`vellym dev`を起動し、ブラウザの3段階
           セットアップから開始する。指定できるオプションは[[cli-reference|CLIリファレンス]]を参照。

           CLIの`init`はcontent root（既定`docs/`）に、人やAI向けの設定・書き方の案内`VELLYM.md`も作る。自由に編集でき、既存ファイルは上書きしない。

        2. **依存をインストールする**

           ```bash
           cd myproject
           npm install
           ```

        3. **開発サーバーを起動する**

           ```bash
           npx vellym dev
           ```

           既定で `http://127.0.0.1:4173` にバインドする。起動時に表示されるURLを
           ブラウザで開く。

        4. **ブラウザで閲覧・編集する**

           文書ツリー、アウトライン、検索、編集、構造編集が使える。画面操作は
           [[browser-guide|ブラウザ画面の使い方]]を参照。

        ## AIに導入を依頼する

        AIエージェントにVellym導入を任せる場合も、手順は対話不要のコマンドで構成できる。

        1. **対話不要で初期化する**

           ```bash
           npx vellym@beta init myproject --size small-team --method hybrid --language ja --plugins tickets
           ```

           `--size`・`--method`・`--language`のどれかが欠けると、CLIは足りないオプションと
           指定できる値、実行例を一覧表示して終了コード`1`で止まる（`--language`自体が
           未指定なら候補は日英の両方で表示される）。AIは一覧から値を選び、必要な
           オプションをすべて指定して実行し直せばよい。`--plugins`は公式プラグインの
           短縮名をカンマ区切りで渡し、公式パッケージを`dependencies`へ、実行した
           `vellym`の版を`devDependencies`へ書き込む。
           `init`は`npm install`を実行しない。

        2. **依存をインストールする**

           ```bash
           cd myproject
           npm install
           ```

        3. **最初のチケット管理を作る**

           `--plugins tickets`を有効にしたプロジェクトでは、任意のフォルダへ
           `TicketTracker` YAMLを1つ置くとチケット一覧が使えるようになる。最小の形は：

           ```yaml
           apiVersion: vellym.tasclub.com/v1
           kind: TicketTracker
           metadata:
             name: tickets
             title: チケット
           spec:
             statuses:
               - { id: todo, label: 未着手, category: open }
               - { id: doing, label: 対応中, category: open }
               - { id: done, label: 完了, category: closed }
             fields: []
           ```

           置いたら`npx vellym validate`で診断0件を確認できる。チケットそのものや項目の
           書き方は[[ticket-management|チケット管理]]を参照。

        4. **開発サーバーを起動して確認する**

           ```bash
           npx vellym dev
           ```

           起動時に表示されるURLをブラウザで開くと、置いた`TicketTracker`の一覧が
           表示される。

        ## 設定ファイルなしで始める

        `vellym.config.yaml`が無いディレクトリで`vellym dev`を起動すると、
        ブラウザ上の**初期セットアップ**が表示される。画面の案内に従って言語・保存先・
        文書構成を選ぶと、そのまま同じサーバーで文書ワークスペースへ切り替わる。
        セットアップ画面の流れは[[browser-guide|ブラウザ画面の使い方]]を参照。

        設定ファイルが存在するが壊れている場合は、上書きせず設定エラーとして表示する。

        ## 検証する

        文書のスキーマや参照に問題がないかを確認するには：

        ```bash
        vellym validate
        ```

        ページ数と診断（エラー・警告）の一覧を表示する。詳細は[[cli-reference|CLIリファレンス]]を参照。

        ## 配布・資料化する

        閲覧専用の静的サイトを書き出すには：

        ```bash
        vellym build
        ```

        生成物の配信手順と注意点は[[self-hosting|静的配信と自己ホスト]]を参照。

        ## 関連

        - 用語の確認 → [[concepts|用語と基本概念]]
        - コマンド一覧 → [[cli-reference|CLIリファレンス]]
        - 設定ファイル → [[configuration|設定ファイル]]
  translations:
    en:
      visibility: published
      title: Getting Started
      blocks:
        - id: getting-started
          type: rich-text
          format: commonmark
          content: |
            ## Prerequisites

            - **Node.js 22.12 or later** and **npm** (verified on the 22 and 24 lines).
            - If you would rather not install Node.js on the host, there is a Docker path
              ([[self-hosting|Static Publishing and Self-Hosting]]).

            The examples below invoke the built CLI in the development repo
            (`packages/vellym/dist/cli.mjs`) directly. In a distributed build you run it as
            the `vellym` command.

            ## Shortest path

            1. **Initialize a project**

               ```bash
               npx vellym@beta init myproject --size small-team --method hybrid --language ja
               ```

               Writes `vellym.config.yaml` plus the standard folder and page hierarchy (choose `--level light` or `strict` for others) for the
               given size and method. It also records the running Vellym version in
               `package.json`'s `devDependencies`. To choose folders and pages individually
               instead, skip `init` and run `vellym dev` to use the three-step browser setup. See
               [[cli-reference|CLI Reference]] for the available options.

               CLI `init` also creates `VELLYM.md` in the content root (default `docs/`),
               a guide to configuration and writing for people and AI. You can edit it freely;
               an existing file is never overwritten.

            2. **Install dependencies**

               ```bash
               cd myproject
               npm install
               ```

            3. **Start the dev server**

               ```bash
               npx vellym dev
               ```

               Binds to `http://127.0.0.1:4173` by default. Open the URL printed at startup.

            4. **Read and edit in the browser**

               Document tree, outline, search, editing, and structure editing are available.
               See [[browser-guide|Using the Browser UI]].

            ## Asking an AI to set it up

            When an AI agent introduces Vellym, every step is a non-interactive command.

            1. **Initialize without prompts**

               ```bash
               npx vellym@beta init myproject --size small-team --method hybrid --language en --plugins tickets
               ```

               If `--size`, `--method`, or `--language` is missing, the CLI lists the missing
               options, the values they accept, and example commands, then exits with code
               `1` (when `--language` itself is unset, the candidates appear in both Japanese
               and English). The agent picks values from that list and reruns the command
               with every required option. `--plugins` takes comma-separated official plugin
               short names and writes the official packages into `dependencies`; it writes
               the running Vellym version into `devDependencies`. `init` never runs
               `npm install` itself.

            2. **Install the dependencies**

               ```bash
               cd myproject
               npm install
               ```

            3. **Create the first ticket tracker**

               With `--plugins tickets` enabled, placing one `TicketTracker` YAML in any
               folder turns on the ticket list. The minimal shape is:

               ```yaml
               apiVersion: vellym.tasclub.com/v1
               kind: TicketTracker
               metadata:
                 name: tickets
                 title: Tickets
               spec:
                 statuses:
                   - { id: todo, label: todo, category: open }
                   - { id: doing, label: doing, category: open }
                   - { id: done, label: done, category: closed }
                 fields: []
               ```

               After placing it, `npx vellym validate` reports zero diagnostics. See
               [[ticket-management|Ticket Management]] for tickets and fields.

            4. **Start the dev server and check**

               ```bash
               npx vellym dev
               ```

               Open the URL printed at startup; the list for the tracker you placed appears.

            ## Start without a config file

            If you run `vellym dev` in a directory with no `vellym.config.yaml`, the
            in-browser **setup** appears. Follow it to choose language, location, and document
            structure; it then switches to the document workspace on the same server. The
            setup flow is described in [[browser-guide|Using the Browser UI]].

            If a config file exists but is broken, Vellym does not overwrite it and shows a
            config error instead.

            ## Validate

            To check documents for schema or reference problems:

            ```bash
            vellym validate
            ```

            It reports the page count and a list of diagnostics (errors / warnings). See
            [[cli-reference|CLI Reference]].

            ## Distribute as material

            To export a read-only static site:

            ```bash
            vellym build
            ```

            See [[self-hosting|Static Publishing and Self-Hosting]] for serving and caveats.

            ## Related

            - Check terminology → [[concepts|Terminology and Concepts]]
            - Command list → [[cli-reference|CLI Reference]]
            - Config file → [[configuration|Configuration File]]
