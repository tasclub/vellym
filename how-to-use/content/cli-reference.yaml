apiVersion: vellym.tasclub.com/v1alpha1
kind: Page
metadata:
  name: cli-reference
  title: CLIリファレンス
spec:
  documentType: guide
  locale: ja
  blocks:
    - id: cli-reference
      type: rich-text
      format: commonmark
      content: |
        ## 概要

        現在のCLIは、`init`・`add`・`dev`・`validate`・`list`・`schema`・`build`・`migrate`を提供する。
        以下は生成済みCLIを直接呼ぶ例で示す。

        ```bash
        node packages/vellym/dist/cli.mjs <command> [options]
        ```

        配布物では`vellym <command> [options]`として実行できる。

        - `vellym help` / `vellym --help`：使い方を表示する。
        - `vellym <command> --help`：各コマンドのヘルプを表示する。
        - `vellym --version`：バージョンを表示する。
        - `--language ja|en`：CLI表示の言語を指定する（未指定時は設定の`ui.language`、
          それも無ければ日本語）。

        ## init — 初期化

        ```bash
        vellym init [directory] [options]
        ```

        設定ファイルと初期文書を作成する。`directory`を省略するとカレントディレクトリを対象とする。

        | オプション | 説明 |
        | --- | --- |
        | `--root docs\|vellym\|.` | 管理ルート。既定は`docs`。 |
        | `--structure by-type\|by-phase\|by-feature` | フォルダ構成。既定は`by-type`。 |
        | `--numbered` / `--no-numbered` | フォルダ番号の有無。既定は`by-phase`のみ有効。 |
        | `--with-guide-folders` | 利用ガイド用フォルダを追加。 |
        | `--language ja\|en` | UIと初期文書の言語。省略時は環境の言語。 |
        | `--plugins <list>` | 公式プラグインの短縮名をカンマ区切り（例`tickets,kanban,wbs`）。設定ファイルと`package.json`の依存に公式パッケージを追加する。未知の名前は候補を一覧にして終了コード`1`。完了時に、選んだプラグインの使い方のページを案内する。 |
        | `--dry-run` | 作成・skip・更新するファイルを一覧にし、何も書かない。`--json`でJSON出力。 |

        CLIは対話不要で、フォルダと入口を作る。以前の規模・開発方式・構成レベルを指定する引数は廃止された。

        **公式プラグインの導入**

        `--plugins`は公式パッケージを`vellym.config.yaml`の`plugins`と`package.json`の
        `dependencies`に書き込むだけで、`npm install`は実行しない。生成されたプロジェクトの
        ルートで`npm install`してから`vellym dev`を起動する。公式プラグインの導入は
        [[using-plugins|プラグインを使う]]を参照。

        **安全な初期化**

        既存文書はskipする。`package.json`は依存の追加のため更新されることがある。

        ## add — テンプレートの追加

        `vellym add --list [template|set]`で候補を一覧し、
        `vellym add template|set <id> [--folder <path>] [--name <name>]`で追加する。
        プラグインのテンプレートは`<plugin-id>:<id>`と`--folder`を指定する。
        `--dry-run`で計画を確認でき、`--json`でJSON出力する。`--guide`は`VELLYM.md`へ追記し、
        既定の`--no-guide`では追記しない。`--config <path>`で設定を指定できる。

        設定は明示的な`--config`を優先し、省略時はカレントディレクトリ、その`docs/`、
        `vellym/`の設定を探す。複数見つかれば`--config`で指定する。親には遡らない。

        ## dev — 開発サーバー

        ```bash
        vellym dev [options]
        ```

        ローカルでサーバーを起動し、ブラウザ上の閲覧・編集・検索・構造編集を提供する。

        | オプション | 説明 |
        | --- | --- |
        | `--host 127.0.0.1\|0.0.0.0` | バインド先。既定は`127.0.0.1`。コンテナ内からホストへ繋ぐ場合のみ`0.0.0.0`。 |
        | `--port <number>` | 待受ポート。既定は`4173`（1〜65535）。 |
        | `--config <path>` | 設定ファイルのパス。省略時は上記の順に探索。 |

        設定ファイルが無いディレクトリで起動すると、ブラウザの初期セットアップを表示する。

        ## list — 索引の一覧

        `vellym list --kind <kind> [--where <key>=<value>]... [--json] [--config <path>] [--language ja|en]`はリソースを変更せず索引行を表示する。`--where`は完全一致、配列は要素の一致、複数条件はAND。`--json`は`data: { kind, rows }`と診断を出す。診断があっても終了コードは0、kind省略・未知のkind・不正な条件は2。検証は`validate`を使う。

        ## schema — JSON Schema

        ```bash
        vellym schema --kind <kind> [--config <path>] [--language ja|en]
        vellym schema --list [--config <path>] [--language ja|en]
        ```

        `--kind`はインストール済みの版に対応するkind全体のJSON Schemaを、整形JSONで標準出力へ出す（`--json`は不要）。
        `--list`はkind名を1行ずつ表示する。`--config`を指定すると、その設定の`plugins`が登録したkindも含める。
        省略時はCoreの`Page`・`Folder`・`PageTranslation`・`FolderTranslation`だけを扱う。
        プラグインkindのschemaは`registerKind`の`specSchema`から作る。未知のkindは終了コード`1`となり、指定可能なkindを表示する。

        ```bash
        vellym schema --kind Page
        vellym schema --kind Ticket --config vellym.config.yaml
        vellym schema --list --config vellym.config.yaml
        ```

        ## validate — 検証

        ```bash
        vellym validate [--json] [--strict] [--config <path>]
        ```

        正本を読み込み、ページ数と診断（エラー・警告）を表示する。エラーが1件でもあれば
        終了コードは`1`になり、それ以外は`0`。`--strict`では警告も終了コード`1`の対象になる。
        `--json`で機械可読な出力にでき、AI・CIでは`vellym validate --strict --json`を使える。
        JSONの診断の重大度は変わらない。

        ## build — 静的サイト生成

        ```bash
        vellym build [--json] [--config <path>]
        ```

        正本から閲覧専用の静的サイトを書き出す。エラーがある場合は生成を中止する。
        既定言語はルートへ、公開済みtranslationはlocale別pathへ一回のbuildで生成する。
        出力先・配信手順・注意点は[[self-hosting|静的配信と自己ホスト]]を参照。

        設定の`outputDir`は、版フォルダを置く場所である。
        `outputDir: dist`なら、`dist/`の下に`<YYYYMMDD-HHmmss>-vellym/`という
        日時つきのフォルダを毎回新しく作る。公開中の版を上書きせず、生成に失敗しても前の版が残るための作りである。
        実際の出力先は`--json`の`data.outputDir`で分かる。古い版は自動では消さないので、不要になったら手で消す。

        ## migrate — Page形式の移行

        ```bash
        vellym migrate --to v1 --plan [--config <path>] [--json]
        vellym migrate --to v1 [--config <path>] [--json]
        ```

        `v1alpha1`のPageとFolderを明示的に`v1`へ移行する。最初のコマンドで対象と診断を確認し、
        Gitへcommitしてから2番目のコマンドで適用する。コメント、未知キー、未知blockを保持し、
        preview後に対象が変わった場合は書き込みを中止する。自動migrationは行わない。

        古い形式（`v1alpha1`）のままのファイルが残っていないかは、`--plan`の対象一覧で分かる。
        `validate`は`v1alpha1`を警告しない（現役の形式として読める）。

        ## 関連

        - 設定ファイルの各項目 → [[configuration|設定ファイル]]
        - 画面の操作 → [[browser-guide|ブラウザ画面の使い方]]
        - 現段階の範囲 → [[limitations|現段階の範囲と制約]]
  translations:
    en:
      visibility: published
      title: CLI Reference
      blocks:
        - id: cli-reference
          type: rich-text
          format: commonmark
          content: |
            ## Overview

            The CLI provides `init`, `add`, `dev`, `validate`, `list`, `schema`, `build`, and `migrate`.
            The examples below invoke the built CLI directly.

            ```bash
            node packages/vellym/dist/cli.mjs <command> [options]
            ```

            In a distributed build you run it as `vellym <command> [options]`.

            - `vellym help` / `vellym --help`: show usage.
            - `vellym <command> --help`: show help for a command.
            - `vellym --version`: show the version.
            - `--language ja|en`: set the CLI display language (falls back to the config's
              `ui.language`, then Japanese).

            ## init — initialize

            ```bash
            vellym init [directory] [options]
            ```

            Creates the config file and initial documents. If `directory` is omitted, the
            current directory is used.

            | Option | Description |
            | --- | --- |
            | `--root docs\|vellym\|.` | Management root, default `docs`. |
            | `--structure by-type\|by-phase\|by-feature` | Folder structure, default `by-type`. |
            | `--numbered` / `--no-numbered` | Folder numbering; enabled by default only for `by-phase`. |
            | `--with-guide-folders` | Add user guide folders. |
            | `--language ja\|en` | UI and initial document language; defaults to the environment locale. |
            | `--plugins <list>` | Official plugin short names, comma-separated (example: `tickets,kanban,wbs`). Adds the official packages to the config file and to `package.json` dependencies. An unknown name lists the candidates and exits with code `1`. When init finishes, it points to the guide of each selected plugin. |
            | `--dry-run` | Lists files to create, skip, or update without writing. Add `--json` for JSON. |

            The CLI is non-interactive and creates folders and an entry page. The former
            project size, development method and structure level options have been removed.

            **Official plugin installation**

            `--plugins` only writes the official packages into `plugins` in
            `vellym.config.yaml` and `dependencies` in `package.json`; it never runs
            `npm install`. Run `npm install` in the generated project root, then start
            `vellym dev`. See [[using-plugins|Using Plugins]] for the official plugins.

            **Safe initialization**

            Existing documents are skipped. `package.json` may be updated to add dependencies.

            ## add — add templates

            List candidates with `vellym add --list [template|set]`, then use
            `vellym add template|set <id> [--folder <path>] [--name <name>]`.
            Plugin templates require `<plugin-id>:<id>` and `--folder`. Use `--dry-run`
            to preview and `--json` for JSON. `--guide` appends to `VELLYM.md`;
            the default `--no-guide` does not. `--config <path>` selects a config.

            An explicit `--config` takes precedence. Otherwise Vellym checks the current
            directory and its `docs/` and `vellym/` subdirectories, without walking parents.
            If multiple configs are found, select one with `--config`.

            ## dev — dev server

            ```bash
            vellym dev [options]
            ```

            Runs a local server that provides in-browser reading, editing, search, and
            structure editing.

            | Option | Description |
            | --- | --- |
            | `--host 127.0.0.1\|0.0.0.0` | Bind address. Defaults to `127.0.0.1`. Use `0.0.0.0` only to reach the host from inside a container. |
            | `--port <number>` | Listen port. Defaults to `4173` (1–65535). |
            | `--config <path>` | Config file path; searched as described above if omitted. |

            Started in a directory with no config file, it shows the in-browser setup.

            ## list — index rows

            `vellym list --kind <kind> [--where <key>=<value>]... [--json] [--config <path>] [--language ja|en]` lists index rows without modifying resources. `--where` matches exactly, including array elements; repeated conditions are ANDed. `--json` emits `data: { kind, rows }` and diagnostics. Diagnostics do not change exit code 0; missing or unknown kind and invalid filters exit 2. Use `validate` to check resources.

            ## schema — JSON Schema

            ```bash
            vellym schema --kind <kind> [--config <path>] [--language ja|en]
            vellym schema --list [--config <path>] [--language ja|en]
            ```

            `--kind` prints the complete JSON Schema for a kind in the installed version as
            formatted JSON on stdout (`--json` is not needed). `--list` prints one kind per line.
            With `--config`, the list also includes kinds registered by that config's plugins.
            Without it, only the Core kinds `Page`, `Folder`, `PageTranslation`, and
            `FolderTranslation` are available. Plugin schemas are built from the `specSchema`
            passed to `registerKind`. An unknown kind exits with code `1` and lists available kinds.

            ```bash
            vellym schema --kind Page
            vellym schema --kind Ticket --config vellym.config.yaml
            vellym schema --list --config vellym.config.yaml
            ```

            ## validate — validate

            ```bash
            vellym validate [--json] [--strict] [--config <path>]
            ```

            Loads the source and reports the page count and diagnostics (errors / warnings).
            If there is at least one error the exit code is `1`, otherwise `0`. With
            `--strict`, warnings also cause exit code `1`. Use `--json` for machine-readable
            output; AI and CI can use `vellym validate --strict --json`. Diagnostic severities
            in JSON remain unchanged.

            ## build — static site

            ```bash
            vellym build [--json] [--config <path>]
            ```

            Exports a read-only static site from the source. If there are errors, generation
            is aborted. One build emits the default locale at the root and published
            translations under locale-specific paths. See [[self-hosting|Static Publishing and Self-Hosting]]
            for output location, serving, and caveats.

            The config's `outputDir` is the parent of versioned folders. With `outputDir: dist`, each build creates a new
            timestamped folder `<YYYYMMDD-HHmmss>-vellym/` under `dist/`. This keeps the published
            version intact and leaves the previous one in place if a build fails. The actual
            location is reported as `data.outputDir` by `--json`. Old versions are never removed
            automatically; delete them by hand when you no longer need them.

            ## migrate — Page format migration

            ```bash
            vellym migrate --to v1 --plan [--config <path>] [--json]
            vellym migrate --to v1 [--config <path>] [--json]
            ```

            Explicitly migrates `v1alpha1` Page and Folder resources to `v1`. Preview the
            targets and diagnostics first, commit the project to Git, and then apply. The
            migration preserves comments, unknown keys, and unknown blocks and aborts if a
            target changes after preview. Vellym never migrates files automatically.

            To find files still in the old `v1alpha1` format, look at the targets listed by
            `--plan`. `validate` does not warn about `v1alpha1`, because it is still read as a
            supported format.

            ## Related

            - Config file fields → [[configuration|Configuration File]]
            - Browser UI → [[browser-guide|Using the Browser UI]]
            - Current scope → [[limitations|Current Scope and Limitations]]
