apiVersion: vellym.tasclub.com/v1alpha1
kind: Page
metadata:
  name: cli-reference
  title: CLIリファレンス
spec:
  documentType: guide
  locale: ja
  blocks:
    - id: cli-reference
      type: rich-text
      format: commonmark
      content: |
        ## 概要

        現在のCLIは、`init`・`dev`・`validate`・`list`・`build`・`migrate`を提供する。
        以下は生成済みCLIを直接呼ぶ例で示す。

        ```bash
        node packages/vellym/dist/cli.mjs <command> [options]
        ```

        配布物では`vellym <command> [options]`として実行できる。

        - `vellym help` / `vellym --help`：使い方を表示する。
        - `vellym <command> --help`：各コマンドのヘルプを表示する。
        - `vellym --version`：バージョンを表示する。
        - `--language ja|en`：CLI表示の言語を指定する（未指定時は設定の`ui.language`、
          それも無ければ日本語）。

        ## init — 初期化

        ```bash
        vellym init [directory] [options]
        ```

        設定ファイルと初期文書を作成する。`directory`を省略するとカレントディレクトリを対象とする。

        | オプション | 説明 |
        | --- | --- |
        | `--size <value>` | `personal`、`small-team`、`medium-large`のいずれか。 |
        | `--method <value>` | `agile`、`hybrid`、`waterfall`のいずれか。 |
        | `--language ja\|en` | UIと初期文書の言語。 |
        | `--content-root <path>` | 正本を置くディレクトリ（project rootからの相対path）。 |
        | `--plugins <list>` | 公式プラグインの短縮名をカンマ区切り（例`tickets,kanban,wbs`）。設定ファイルと`package.json`の依存に公式パッケージを追加する。未知の名前は候補を一覧にして終了コード`1`。 |
        CLIは対話選択を行わず、指定した規模と開発方式の厳格構成を一括生成する。
        個別候補の追加・除外はブラウザの初期セットアップまたは設定画面で行う。

        **必須引数の候補表示**

        `--size`・`--method`・`--language`のどれかが無い場合は、足りないオプションと
        指定できる値、実行例を一覧表示して終了コード`1`で終わる。`--language`が未指定なら
        候補は日英の両方で表示される。値を決められる側（AIエージェントを含む）は、
        一覧から選んで必要なオプションをすべて指定し直して実行する。

        **公式プラグインの導入**

        `--plugins`は公式パッケージを`vellym.config.yaml`の`plugins`と`package.json`の
        `dependencies`に書き込むだけで、`npm install`は実行しない。生成されたプロジェクトの
        ルートで`npm install`してから`vellym dev`を起動する。公式プラグインの導入は
        [[using-plugins|プラグインを使う]]を参照。

        **安全な初期化**

        Page候補と同じpathが既に存在する場合はそのPageだけをskipする。既存ファイルを上書き・変更・削除しない。

        ## dev — 開発サーバー

        ```bash
        vellym dev [options]
        ```

        ローカルでサーバーを起動し、ブラウザ上の閲覧・編集・検索・構造編集を提供する。

        | オプション | 説明 |
        | --- | --- |
        | `--host 127.0.0.1\|0.0.0.0` | バインド先。既定は`127.0.0.1`。コンテナ内からホストへ繋ぐ場合のみ`0.0.0.0`。 |
        | `--port <number>` | 待受ポート。既定は`4173`（1〜65535）。 |
        | `--config <path>` | 設定ファイルのパス。既定は`vellym.config.yaml`。 |

        設定ファイルが無いディレクトリで起動すると、ブラウザの初期セットアップを表示する。

        ## list — 索引の一覧

        `vellym list --kind <kind> [--where <key>=<value>]... [--json] [--config <path>] [--language ja|en]`はリソースを変更せず索引行を表示する。`--where`は完全一致、配列は要素の一致、複数条件はAND。`--json`は`data: { kind, rows }`と診断を出す。診断があっても終了コードは0、kind省略・未知のkind・不正な条件は2。検証は`validate`を使う。

        ## validate — 検証

        ```bash
        vellym validate [--json] [--strict] [--config <path>]
        ```

        正本を読み込み、ページ数と診断（エラー・警告）を表示する。エラーが1件でもあれば
        終了コードは`1`になり、それ以外は`0`。`--strict`では警告も終了コード`1`の対象になる。
        `--json`で機械可読な出力にでき、AI・CIでは`vellym validate --strict --json`を使える。
        JSONの診断の重大度は変わらない。

        ## build — 静的サイト生成

        ```bash
        vellym build [--json] [--config <path>]
        ```

        正本から閲覧専用の静的サイトを書き出す。エラーがある場合は生成を中止する。
        既定言語はルートへ、公開済みtranslationはlocale別pathへ一回のbuildで生成する。
        出力先・配信手順・注意点は[[self-hosting|静的配信と自己ホスト]]を参照。

        ## migrate — Page形式の移行

        ```bash
        vellym migrate --to v1 --plan [--config <path>] [--json]
        vellym migrate --to v1 [--config <path>] [--json]
        ```

        `v1alpha1`のPageとFolderを明示的に`v1`へ移行する。最初のコマンドで対象と診断を確認し、
        Gitへcommitしてから2番目のコマンドで適用する。コメント、未知キー、未知blockを保持し、
        preview後に対象が変わった場合は書き込みを中止する。自動migrationは行わない。

        ## 関連

        - 設定ファイルの各項目 → [[configuration|設定ファイル]]
        - 画面の操作 → [[browser-guide|ブラウザ画面の使い方]]
        - 現段階の範囲 → [[limitations|現段階の範囲と制約]]
  translations:
    en:
      visibility: published
      title: CLI Reference
      blocks:
        - id: cli-reference
          type: rich-text
          format: commonmark
          content: |
            ## Overview

            The CLI provides `init`, `dev`, `validate`, `list`, `build`, and `migrate`.
            The examples below invoke the built CLI directly.

            ```bash
            node packages/vellym/dist/cli.mjs <command> [options]
            ```

            In a distributed build you run it as `vellym <command> [options]`.

            - `vellym help` / `vellym --help`: show usage.
            - `vellym <command> --help`: show help for a command.
            - `vellym --version`: show the version.
            - `--language ja|en`: set the CLI display language (falls back to the config's
              `ui.language`, then Japanese).

            ## init — initialize

            ```bash
            vellym init [directory] [options]
            ```

            Creates the config file and initial documents. If `directory` is omitted, the
            current directory is used.

            | Option | Description |
            | --- | --- |
            | `--size <value>` | One of `personal`, `small-team`, or `medium-large`. |
            | `--method <value>` | One of `agile`, `hybrid`, or `waterfall`. |
            | `--language ja\|en` | Language of the UI and initial documents. |
            | `--content-root <path>` | Directory that holds the source (relative to project root). |
            | `--plugins <list>` | Official plugin short names, comma-separated (example: `tickets,kanban,wbs`). Adds the official packages to the config file and to `package.json` dependencies. An unknown name lists the candidates and exits with code `1`. |
            The CLI is non-interactive and creates the strict structure for the selected size
            and development method. Add or remove individual candidates in the browser setup
            or later from Settings.

            **Candidate list for missing options**

            If `--size`, `--method`, or `--language` is missing, the CLI lists the missing
            options, the values they accept, and example commands, then exits with code `1`.
            When `--language` itself is unset, the candidates appear in both Japanese and
            English. Whoever chooses the values (an AI agent included) picks from that list
            and reruns with every required option.

            **Official plugin installation**

            `--plugins` only writes the official packages into `plugins` in
            `vellym.config.yaml` and `dependencies` in `package.json`; it never runs
            `npm install`. Run `npm install` in the generated project root, then start
            `vellym dev`. See [[using-plugins|Using Plugins]] for the official plugins.

            **Safe initialization**

            If a Page candidate path already exists, the CLI skips that Page. It does not
            overwrite, change, or delete existing files, directories, or unrelated files. It
            creates the other non-conflicting
            candidates.

            ## dev — dev server

            ```bash
            vellym dev [options]
            ```

            Runs a local server that provides in-browser reading, editing, search, and
            structure editing.

            | Option | Description |
            | --- | --- |
            | `--host 127.0.0.1\|0.0.0.0` | Bind address. Defaults to `127.0.0.1`. Use `0.0.0.0` only to reach the host from inside a container. |
            | `--port <number>` | Listen port. Defaults to `4173` (1–65535). |
            | `--config <path>` | Config file path. Defaults to `vellym.config.yaml`. |

            Started in a directory with no config file, it shows the in-browser setup.

            ## list — index rows

            `vellym list --kind <kind> [--where <key>=<value>]... [--json] [--config <path>] [--language ja|en]` lists index rows without modifying resources. `--where` matches exactly, including array elements; repeated conditions are ANDed. `--json` emits `data: { kind, rows }` and diagnostics. Diagnostics do not change exit code 0; missing or unknown kind and invalid filters exit 2. Use `validate` to check resources.

            ## validate — validate

            ```bash
            vellym validate [--json] [--strict] [--config <path>]
            ```

            Loads the source and reports the page count and diagnostics (errors / warnings).
            If there is at least one error the exit code is `1`, otherwise `0`. With
            `--strict`, warnings also cause exit code `1`. Use `--json` for machine-readable
            output; AI and CI can use `vellym validate --strict --json`. Diagnostic severities
            in JSON remain unchanged.

            ## build — static site

            ```bash
            vellym build [--json] [--config <path>]
            ```

            Exports a read-only static site from the source. If there are errors, generation
            is aborted. One build emits the default locale at the root and published
            translations under locale-specific paths. See [[self-hosting|Static Publishing and Self-Hosting]]
            for output location, serving, and caveats.

            ## migrate — Page format migration

            ```bash
            vellym migrate --to v1 --plan [--config <path>] [--json]
            vellym migrate --to v1 [--config <path>] [--json]
            ```

            Explicitly migrates `v1alpha1` Page and Folder resources to `v1`. Preview the
            targets and diagnostics first, commit the project to Git, and then apply. The
            migration preserves comments, unknown keys, and unknown blocks and aborts if a
            target changes after preview. Vellym never migrates files automatically.

            ## Related

            - Config file fields → [[configuration|Configuration File]]
            - Browser UI → [[browser-guide|Using the Browser UI]]
            - Current scope → [[limitations|Current Scope and Limitations]]
