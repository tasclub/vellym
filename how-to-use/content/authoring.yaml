apiVersion: vellym.tasclub.com/v1alpha1
kind: Page
metadata:
  name: authoring
  title: 文書の書き方（YAML）
spec:
  documentType: guide
  locale: ja
  blocks:
    - id: authoring
      type: rich-text
      format: commonmark
      content: |
        ## 対象

        このページは、正本YAMLを直接書く・編集する執筆者向けである。ブラウザ上での
        操作は[ブラウザ画面の使い方](#page=browser-guide)を参照。

        ## Pageの最小構造

        一つのYAMLファイルが一つのPageに対応する。最小の構造は次のとおり。

        ```yaml
        apiVersion: vellym.tasclub.com/v1
        kind: Page
        metadata:
          name: getting-started
          title: はじめかた
        spec:
          documentType: guide
          locale: ja
          blocks:
            - id: body
              type: rich-text
              format: commonmark
              content: |
                ## 見出し

                本文をMarkdown（CommonMark）で書く。
        ```

        ## metadata

        | キー | 必須 | 説明 |
        | --- | --- | --- |
        | `name` | はい | Page識別子。小文字英数字とハイフンのkebab-case（例: `getting-started`）。`slug`未設定時は内部リンク`#page=<name>`の参照先になる。 |
        | `title` | はい | 表示タイトル（1文字以上）。 |
        | `slug` | いいえ | URL用の識別子。文字・数字とハイフンから成る。 |
        | `labels` | いいえ | 文字列の対応表（キー: 値）。分類・絞り込み用のメタ情報。 |
        | `annotations` | いいえ | 文字列の対応表。補足メタ情報。 |

        ## spec

        | キー | 必須 | 説明 |
        | --- | --- | --- |
        | `blocks` | はい | 本文ブロックの配列。 |
        | `documentType` | いいえ | 文書種別（例: `guide`、`requirement`など）。 |
        | `locale` | いいえ | 正本の言語。省略時は設定の既定言語。初回translation保存時には明示値として固定される。 |
        | `translations` | いいえ | localeをキーにした翻訳の対応表。Page ID、slug、分類metadataは正本と共有する。 |

        ## 翻訳を同じPageへ追加する

        翻訳ごとに別Pageファイルを作らず、`spec.translations`へタイトルとblocksを記載する。
        `visibility`を省略すると`published`として扱われ、`draft`は編集画面では保持されるが
        閲覧・検索・静的サイトには公開されない。

        ```yaml
        spec:
          locale: ja
          blocks:
            - id: body
              type: rich-text
              format: commonmark
              content: 日本語の本文
          translations:
            en:
              visibility: published
              title: Getting Started
              blocks:
                - id: body
                  type: rich-text
                  format: commonmark
                  content: English body
        ```

        translationの`title`と`blocks`は必須である。現段階のブラウザ編集で追加できる
        言語は日本語と英語である。Vellymは翻訳や鮮度判定を行わない。

        ## ブロック（rich-text）

        現在の実装で利用できる本文ブロックは`rich-text`である。

        ```yaml
        - id: body
          type: rich-text
          format: commonmark
          content: |
            ## 見出し

            段落・箇条書き・表・コードなど、CommonMark記法が使える。
        ```

        | キー | 必須 | 値 |
        | --- | --- | --- |
        | `id` | はい | ブロック識別子。kebab-case。同一Page内で一意にする。 |
        | `type` | はい | `rich-text` 固定。 |
        | `format` | はい | `commonmark` 固定。 |
        | `content` | はい | 本文。YAMLのブロックスカラー（`|`）で複数行を書く。 |

        ## 内部リンク

        本文中で他のPageへリンクするには、標準のMarkdownリンクで参照先を
        `#page=<slug>`にする。`slug`は参照先の`metadata.slug`で、未設定時は
        `metadata.name`が使われる（例: `[CLIリファレンス](#page=cli-reference)`）。

        ## フォルダと表示順（_index.yaml）

        ディレクトリの表示順は、そのディレクトリの`_index.yaml`（`kind: Folder`）で定義する。

        ```yaml
        apiVersion: vellym.tasclub.com/v1
        kind: Folder
        metadata:
          title: 利用ガイド
        spec:
          order:
            - index.yaml
            - concepts.yaml
            - getting-started.yaml
        ```

        `spec.order`には、そのフォルダ内のファイル名・サブフォルダ名を並べる。
        Folderの表示名と説明も、Pageと同様に`spec.translations.<locale>`へ
        `title`、任意の`description`、任意の`visibility`を記載できる。Folder構造と順序は全言語で共有する。

        ## 命名と検証

        - `metadata.name`とブロック`id`はkebab-case（小文字英数字とハイフン）にする。
        - 一つのファイルに一つのPageを書く。
        - 書いたら`vellym validate`でスキーマ・参照を検証する（[CLIリファレンス](#page=cli-reference)）。

        ## 関連

        - 用語 → [用語と基本概念](#page=concepts)
        - 画面での編集 → [ブラウザ画面の使い方](#page=browser-guide)
  translations:
    en:
      visibility: published
      title: Authoring Documents (YAML)
      blocks:
        - id: authoring
          type: rich-text
          format: commonmark
          content: |
            ## Audience

            This page is for authors writing or editing the source YAML directly. For working
            in the browser, see [Using the Browser UI](#page=browser-guide).

            ## Minimal Page structure

            One YAML file corresponds to one Page. The minimal structure is:

            ```yaml
            apiVersion: vellym.tasclub.com/v1
            kind: Page
            metadata:
              name: getting-started
              title: Getting Started
            spec:
              documentType: guide
              locale: en
              blocks:
                - id: body
                  type: rich-text
                  format: commonmark
                  content: |
                    ## Heading

                    Write the body in Markdown (CommonMark).
            ```

            ## metadata

            | Key | Required | Description |
            | --- | --- | --- |
            | `name` | yes | Page identifier. Lowercase alphanumeric kebab-case (e.g. `getting-started`). Target of `#page=<name>` internal links when `slug` is unset. |
            | `title` | yes | Display title (at least one character). |
            | `slug` | no | URL identifier made of letters, digits, and hyphens. |
            | `labels` | no | String map (key: value) for classification/filtering metadata. |
            | `annotations` | no | String map for supplementary metadata. |

            ## spec

            | Key | Required | Description |
            | --- | --- | --- |
            | `blocks` | yes | Array of body blocks. |
            | `documentType` | no | Document type (e.g. `guide`, `requirement`). |
            | `locale` | no | Language of the canonical Page. Defaults to the configured locale. |
            | `translations` | no | Map keyed by locale. Page ID, slug, and classification metadata remain shared. |

            ## Add an English or Japanese translation

            Keep the translation in the same Page YAML under `spec.translations`. Vellym currently offers Japanese and English in the browser editor. A translation requires both `title` and `blocks`; Vellym does not generate translations or judge whether they are stale.

            ## The rich-text block

            The body block available in the current implementation is `rich-text`.

            ```yaml
            - id: body
              type: rich-text
              format: commonmark
              content: |
                ## Heading

                Paragraphs, lists, tables, and code in CommonMark are supported.
            ```

            | Key | Required | Value |
            | --- | --- | --- |
            | `id` | yes | Block identifier, kebab-case. Unique within the Page. |
            | `type` | yes | Fixed `rich-text`. |
            | `format` | yes | Fixed `commonmark`. |
            | `content` | yes | Body text. Use a YAML block scalar (`|`) for multiple lines. |

            ## Internal links

            To link to another Page, use a standard Markdown link whose target is
            `#page=<slug>`. The `slug` is the target's `metadata.slug`, falling back to
            `metadata.name` when unset (e.g. `[CLI Reference](#page=cli-reference)`).

            ## Folders and display order (_index.yaml)

            A directory's display order is defined by its `_index.yaml` (`kind: Folder`).

            ```yaml
            apiVersion: vellym.tasclub.com/v1
            kind: Folder
            metadata:
              title: User Guide
            spec:
              order:
                - index.yaml
                - concepts.yaml
                - getting-started.yaml
            ```

            List the file and subfolder names of that folder in `spec.order`.

            ## Naming and validation

            - Make `metadata.name` and block `id` kebab-case (lowercase alphanumeric and hyphens).
            - Put one Page per file.
            - After writing, run `vellym validate` to check schema and references
              ([CLI Reference](#page=cli-reference)).

            ## Related

            - Terminology → [Terminology and Concepts](#page=concepts)
            - Editing in the browser → [Using the Browser UI](#page=browser-guide)
