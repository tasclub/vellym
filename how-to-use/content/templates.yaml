apiVersion: vellym.tasclub.com/v1alpha1
kind: Page
metadata:
  name: templates
  title: テンプレートとセット
spec:
  documentType: guide
  locale: ja
  blocks:
    - id: templates
      type: rich-text
      format: commonmark
      content: |
        初期設定では設定・入口・`VELLYM.md`とフォルダの枠を作り、テンプレートの文書やTicket管理は必要になったときに追加します。テンプレートは文書1つ、Ticket管理テンプレートはプラグインが提供する`TicketTracker`、セットは複数のテンプレートをまとめたものです。追加した文書は利用者のものになり、テンプレートが後で変わっても書き換わりません。

        ## 構成の型を選ぶ

        初期セットアップ画面または`vellym init --structure <id>`で選びます。迷ったら、標準の「種類別」から始めてください。構成の型は追加時の役割の行き先を決めます。フォルダ名や番号は初期設定で調整でき、追加時には行き先を指定して上書きできます。

        | ID | 構成 | 向いている使い方 |
        | --- | --- | --- |
        | `by-type` | 種類別。概要・管理・要求・設計など、文書の種類ごとに分ける。番号なしが既定 | まず文書を少しずつ足す一般的な開発。下のシナリオA |
        | `by-phase` | 工程別。要件定義・基本設計・製造・テストなど、工程の順に分ける。番号ありが既定 | 工程ごとに成果物とレビューを管理する日本型WF。シナリオB |
        | `by-feature` | 機能別。要求・外部設計・内部設計を機能ごとのフォルダにまとめる | 機能単位で要求から設計までを一緒に見たい場合 |

        機能別では、これらの文書を追加するときに機能名が必要です。CLIの`--name`は機能フォルダ名と文書名の両方に使われます。テンプレートの標準タイトルを保つ場合は、`--folder`で機能フォルダを直接指定してください。

        「利用者向け（`guide`）」は既存の型に足せる補助構成です。チュートリアル・使い方・リファレンス・解説のフォルダを追加します（`vellym init --with-guide-folders`）。

        ## 使い方の例

        ### 2人とAIで作る小さなWebアプリ（アジャイル）

        種類別・番号なしを使います。導入時にチケットとカンバンのプラグインを有効にし、立ち上げのセットを追加します。バックログのTicket管理にストーリーを集め、ロードマップや機能要件、非機能要件、アーキテクチャ概要、決定記録など必要な文書を選んで作ります。スプリントごとに名前付きの「スプリント」セットを足し、スプリントのページにゴール・レビュー・振り返りを書きます。Ticketはバックログの場所に置いたまま「スプリント」項目で振り分けます。リリース時はリリース記録を追加します。

        ```bash
        npx vellym init --plugins tickets,kanban
        vellym add set start
        vellym add template tickets:backlog --folder "管理"
        vellym add set sprint --name "Sprint 3"
        vellym add template release-record
        ```

        上の`--folder "管理"`は、日本語・種類別の既定構成での例です。`--folder`のパスは文書ルート（`contentRoot`）からの相対パスです。カンバンの表示には`@vellym/kanban`も有効にします。

        ### 日本型WFの受託案件

        工程別・番号ありを使い、チケットとWBSのプラグインを有効にします。立ち上げ・計画のセットと予測型の追加を使って、計画、WBS、課題・QA・変更要求・リスクの管理を始めます。各工程で名前付きの「工程」セットを繰り返し追加し、その工程のページとレビュー指摘のTicket管理を置きます。要件定義書、業務フロー、画面一覧、方式設計、データ設計、テスト仕様、移行計画など、成果物に合わせて文書テンプレートを追加します。

        ```bash
        npx vellym init --structure by-phase --plugins tickets,wbs
        vellym add set start
        vellym add set planning
        vellym add set predictive
        vellym add set phase --name "要件定義"
        vellym add template requirements-definition
        ```

        どちらの例も出発点です。すべてを一度に作らず、使うものだけ追加してください。細かな流れは[[getting-started|はじめかた]]、プラグインの導入は[[using-plugins|プラグインを使う]]を参照。

        ## テンプレート・Ticket管理・セットの一覧

        IDは`vellym add`で使うカタログ上のIDです。名前はカタログの表示名です。

        ### 文書テンプレート

        | ID | 名前 | 用途 |
        | --- | --- | --- |
        | `acceptance-scenario` | 受入シナリオ | 受入シナリオと自動で確かめる手順 |
        | `api-design` | API設計 | APIの操作・入出力・エラー |
        | `architecture-overview` | アーキテクチャ概要 | システム構成と品質の優先順位 |
        | `background-and-problem` | 背景と課題 | 背景、利用者の課題、解決後の変化 |
        | `batch-design` | バッチ設計 | 起動条件、処理、エラーと再実行 |
        | `business-flow` | 業務フロー | 業務の流れと各手順 |
        | `communication-plan` | コミュニケーション計画 | 会議体と連絡方法 |
        | `completion-handover` | 完了報告と引継ぎ | 達成度、成果物、残作業と運用の引継ぎ |
        | `current-status` | 現在地 | 現在の状態、次にすること、停滞事項 |
        | `data-design` | データ設計 | ER図、テーブル定義と保持期間 |
        | `decision` | 決定記録 | 判断の背景、代替案と採用理由 |
        | `design-doc` | デザインドック | 大きな設計案と代替案の議論 |
        | `detailed-design` | 詳細設計 | モジュールの処理、責務と例外 |
        | `development-rules` | 開発ルール | 開発・レビュー・完了の決まり |
        | `environment-build-deploy` | 環境・ビルド・デプロイ | 環境とビルド・デプロイの手順 |
        | `external-interface-design` | 外部インターフェース設計 | 外部システムとの連携方式と再送 |
        | `functional-requirements` | 機能要件 | 機能ごとの要件と受入条件 |
        | `glossary` | 用語集 | 用語と意味 |
        | `incident-response` | 障害対応手順 | 障害の検知、切り分けと対応 |
        | `meeting-minutes` | 議事録 | 議題、決定事項と宿題 |
        | `migration-plan` | 移行計画 | 移行手順、確認と切り戻し |
        | `non-functional-requirements` | 非機能要件 | 品質・運用の目標値と確認方法 |
        | `operations-design` | 運用設計 | 運用体制、監視と定常作業 |
        | `phase` | 工程 | 工程の目的、成果物と完了・承認の記録 |
        | `project-charter` | プロジェクト憲章 | 目的、成功指標、範囲と関係者 |
        | `project-plan` | プロジェクト計画 | 進め方、品質、会議、リスクと変更 |
        | `release-record` | リリース記録 | 版の範囲、判定と利用者向け変更 |
        | `report-design` | 帳票設計 | 帳票の項目、レイアウトと出力条件 |
        | `requirements-definition` | 要件定義書 | 業務と機能・非機能要件の全体像 |
        | `retrospective` | 振り返り | よかったこと、困ったことと改善 |
        | `roadmap` | ロードマップ | 版、節目と判断待ち |
        | `scope` | スコープ | 対象、対象外と変更の手続き |
        | `screen-design` | 画面設計 | 画面の項目、操作とエラー表示 |
        | `screen-list` | 画面一覧 | 画面の目的、利用者と画面遷移 |
        | `sprint` | スプリント | ゴール、Ticket、レビューと振り返り |
        | `stakeholders` | 関係者と体制 | 関係者、役割・責任と承認者 |
        | `system-design` | 方式設計 | 構成と採用技術。`architecture-overview`と同じ内容の別名 |
        | `test-plan` | テスト計画 | 対象、段階、完了条件と体制 |
        | `test-specification` | テスト仕様 | 観点とテストケース・結果 |

        `phase`と`sprint`は繰り返しセットにも使われる文書テンプレートです。`system-design`は`architecture-overview`の別名です。「プロジェクト文書の案内」は`init`が作る入口で、追加用のテンプレートではありません。

        ### Ticket管理テンプレート

        Ticket管理は`@vellym/tickets`プラグインが提供します。プラグインをインストールして設定へ追加したプロジェクトで使えます。IDの`tickets:`はプラグインIDです。

        | ID | 名前 | 用途 |
        | --- | --- | --- |
        | `tickets:backlog` | バックログ | ストーリーの優先度やスプリントを管理 |
        | `tickets:bug` | 不具合 | 再現手順、原因と対応を管理 |
        | `tickets:change-request` | 変更要求 | 変更の理由、影響と判断を管理 |
        | `tickets:issue` | 課題 | 影響、担当と対応結果を管理 |
        | `tickets:qa` | QA | 質問、回答と反映先を管理 |
        | `tickets:review` | レビュー指摘 | 対象文書、指摘と確認を管理 |
        | `tickets:risk` | リスク | 発生可能性、影響と対応を管理 |
        | `tickets:work` | 作業 | 担当、優先度、期限と関連文書を管理 |

        チケット管理の設定方法と画面は[[ticket-management|チケット管理]]を参照してください。プラグイン自体の追加方法は[[using-plugins|プラグインを使う]]を参照。

        ### セット

        セットを足すと、中に含まれる文書テンプレートとTicket管理をまとめて追加します。プラグイン提供のテンプレートが含まれる場合、そのプラグインが無効なら該当項目は飛ばされ、理由が表示されます。

        | ID | 名前 | 内容 |
        | --- | --- | --- |
        | `start` | 立ち上げ | プロジェクト憲章、背景と課題、関係者と体制、用語集 |
        | `planning` | 計画 | ロードマップ、現在地、スコープ、作業・リスクのTicket管理 |
        | `predictive` | 予測型の追加 | プロジェクト計画、コミュニケーション計画、課題・QA・変更要求のTicket管理 |
        | `iterative` | 反復型の追加 | バックログのTicket管理 |
        | `requirements` | 要求 | 機能要件、非機能要件 |
        | `design` | 設計 | アーキテクチャ概要、最初の決定記録、画面設計、データ設計 |
        | `quality-release` | 品質・リリース | テスト計画、受入シナリオ、リリース記録、不具合のTicket管理 |
        | `operations` | 運用 | 運用設計、障害対応手順 |
        | `sprint` | スプリント | 名前付きフォルダにスプリントのページを作る（繰り返し） |
        | `phase` | 工程 | 名前付きフォルダに工程のページとレビュー指摘のTicket管理を作る（繰り返し） |

        ## 画面から追加する

        追加したいフォルダのメニューから「テンプレートから作る」または「セットを足す」を選びます。テンプレートやセットを選ぶと、作成するファイル・飛ばすファイル・行き先を確認できます。繰り返しセットでは名前を入力してから内容を確認し、「作る」を選びます。同じ場所にファイルがある場合は上書きせず飛ばします。

        確認画面の「VELLYM.mdにこの使い方を追記する」を選ぶと、既存の`VELLYM.md`の末尾に使い方を追加します。既存の本文は置き換えず、同じ節は重ねて追加しません。ファイルがない場合は作成しません。

        ## CLIから追加する

        `vellym add --list template`または`vellym add --list set`で候補を確認し、IDを指定します。

        ```bash
        vellym add --list template
        vellym add --list set
        vellym add template roadmap
        vellym add set start
        vellym add set sprint --name "Sprint 3"
        vellym add set phase --name "要件定義" --dry-run
        ```

        文書テンプレートは既定で構成の型に対応する役割のフォルダに作ります。`--folder <path>`を付けると行き先を指定できます。プラグインのテンプレートを直接追加する場合は`<プラグインID>:<ID>`と`--folder`の両方が必要です。たとえば、日本語・種類別の既定構成なら次のようにします。

        ```bash
        vellym add template tickets:work --folder "管理"
        ```

        `--dry-run`は作成計画だけを表示し、ファイルを書きません。`--json`はJSON出力、`--config <path>`は設定ファイルの指定です。`--guide`を付けると`VELLYM.md`へ使い方を追記します。既定は追記しない（`--no-guide`）ため、既存ガイドを変えたくないときはそのまま実行できます。

