  translations:
    en:
      visibility: published
      title: Templates and Sets
      blocks:
        - id: templates
          type: rich-text
          format: commonmark
          content: |
            Initialization creates the configuration, entry page, `VELLYM.md`, and folder structure. Add template documents and ticket management when you need them. A document template creates one document; a ticket-management template is a `TicketTracker` provided by a plugin; a set combines multiple templates. Added documents belong to you and are not rewritten when a template changes later.

            ## Choose a structure

            Choose in the setup screen or with `vellym init --structure <id>`. If unsure, start with the default, "By type." The structure maps each template role to a destination folder. You can adjust folder names and numbering during setup, and override the destination when adding a template.

            | ID | Structure | Suitable for |
            | --- | --- | --- |
            | `by-type` | By type: group documents such as overview, management, requirements, and design. Unnumbered by default. | General development that adds documents as needed. Scenario A below. |
            | `by-phase` | By phase: group documents by stages such as requirements, basic design, implementation, and testing. Numbered by default. | Japanese-style waterfall projects with deliverables and reviews for each phase. Scenario B. |
            | `by-feature` | By feature: collect requirements, external design, and internal design in a folder for each feature. | When you want to keep each feature's requirements and designs together. |

            When adding one of these documents in By feature, provide a feature name. The CLI's `--name` is used for both the feature folder and document name. To keep the template's default title, set the feature folder directly with `--folder`.

            "User guide" (`guide`) is a supplement to an existing structure. It adds folders for tutorials, how-to guides, reference, and explanations (`vellym init --with-guide-folders`).

            ## Example workflows

            ### A small web app built by two people and AI (agile)

            Use By type without numbering. Enable the Ticket and Kanban plugins at setup and add the Start set. Put stories in a backlog tracker, then add only the documents you need, such as a roadmap, functional and non-functional requirements, architecture overview, and decision records. Add a named Sprint set for each iteration; write its goal, review, and retrospective on the sprint page. Keep tickets in the backlog and group them by the Sprint field. Add a release record when releasing.

            ```bash
            npx vellym init --plugins tickets,kanban
            vellym add set start
            vellym add template tickets:backlog --folder "管理"
            vellym add set sprint --name "Sprint 3"
            vellym add template release-record
            ```

            `--folder "管理"` is an example for the default Japanese, By type structure. `--folder` paths are relative to the document root (`contentRoot`). The `@vellym/kanban` plugin must also be enabled to show Kanban.

            ### A Japanese-style waterfall project

            Use numbered By phase and enable the Ticket and WBS plugins. Add the Start and Planning sets, plus Predictive additions, to begin tracking the plan, WBS, issues, questions and answers, change requests, and risks. Add a named Phase set for each phase; it creates a phase page and a review-finding tracker. Add documents as deliverables require them, such as a requirements definition, business flow, screen list, system design, data design, and test specification.

            ```bash
            npx vellym init --structure by-phase --plugins tickets,wbs
            vellym add set start
            vellym add set planning
            vellym add set predictive
            vellym add set phase --name "Requirements"
            vellym add template requirements-definition
            ```

            Both are starting points. Add only what you use rather than creating everything up front. See [[getting-started|Getting Started]] for the short path and [[using-plugins|Using Plugins]] for installing plugins.

            ## Template, ticket-management, and set catalog

            IDs are the catalog IDs used by `vellym add`; names are the catalog display names.

            ### Document templates

            | ID | Name | Purpose |
            | --- | --- | --- |
            | `acceptance-scenario` | Acceptance scenario | Acceptance scenarios and steps to verify automatically |
            | `api-design` | API design | API operations, inputs, outputs, and errors |
            | `architecture-overview` | Architecture overview | System structure and quality priorities |
            | `background-and-problem` | Background and problem | Context, user problems, and expected change |
            | `batch-design` | Batch design | Triggers, processing, errors, and recovery |
            | `business-flow` | Business flow | Business process and steps |
            | `communication-plan` | Communication plan | Meetings and communication methods |
            | `completion-handover` | Completion report and handover | Outcomes, deliverables, remaining work, and operational handover |
            | `current-status` | Current status | Current position, next steps, and blockers |
            | `data-design` | Data design | ER diagram, table definitions, and retention |
            | `decision` | Decision record | Context, alternatives, and rationale |
            | `design-doc` | Design document | Discussion of a major design proposal and alternatives |
            | `detailed-design` | Detailed design | Module processing, responsibilities, and exceptions |
            | `development-rules` | Development rules | Development, review, and completion conventions |
            | `environment-build-deploy` | Environments, build and deployment | Environments and build/deployment procedures |
            | `external-interface-design` | External interface design | Integration methods and retries |
            | `functional-requirements` | Functional requirements | Feature requirements and acceptance criteria |
            | `glossary` | Glossary | Terms and definitions |
            | `incident-response` | Incident response procedure | Incident detection, triage, and response |
            | `meeting-minutes` | Meeting minutes | Agenda, decisions, and follow-up actions |
            | `migration-plan` | Migration plan | Migration steps, verification, and rollback |
            | `non-functional-requirements` | Non-functional requirements | Quality and operational targets and how to verify them |
            | `operations-design` | Operations design | Operations roles, monitoring, and routine work |
            | `phase` | Phase | Phase purpose, deliverables, completion, and approval |
            | `project-charter` | Project charter | Purpose, success measures, scope, and stakeholders |
            | `project-plan` | Project plan | Approach, quality, meetings, risks, and change management |
            | `release-record` | Release record | Release scope, decision, and user-facing changes |
            | `report-design` | Report design | Report fields, layout, and output conditions |
            | `requirements-definition` | Requirements definition | Overview of the business and functional/non-functional requirements |
            | `retrospective` | Retrospective | What went well, problems, and improvements |
            | `roadmap` | Roadmap | Releases, milestones, and pending decisions |
            | `scope` | Scope | In scope, out of scope, and change process |
            | `screen-design` | Screen design | Screen fields, interactions, and error display |
            | `screen-list` | Screen list | Screen purpose, users, and transitions |
            | `sprint` | Sprint | Goal, tickets, review, and retrospective |
            | `stakeholders` | Stakeholders and roles | Stakeholders, responsibilities, and approvers |
            | `system-design` | System design | Architecture and adopted technologies; an alias of `architecture-overview` |
            | `test-plan` | Test plan | Scope, test stages, completion criteria, and team |
            | `test-specification` | Test specification | Test viewpoints, cases, and results |

            `phase` and `sprint` are also used as pages in repeatable sets. `system-design` is an alias of `architecture-overview`. The "Project document guide" is the entry created by `init`, not an addable template.

            ### Ticket-management templates

            Ticket management is provided by the `@vellym/tickets` plugin. Install and enable it in the project to use these templates. The `tickets:` prefix is the plugin ID.

            | ID | Name | Purpose |
            | --- | --- | --- |
            | `tickets:backlog` | Backlog | Manage story priority and sprint |
            | `tickets:bug` | Bug | Manage reproduction steps, cause, and fix |
            | `tickets:change-request` | Change request | Manage reasons, impact, and decisions |
            | `tickets:issue` | Issue | Manage impact, owner, and response |
            | `tickets:qa` | Questions and answers | Manage questions, answers, and documents updated |
            | `tickets:review` | Review finding | Manage target document, finding, and confirmation |
            | `tickets:risk` | Risk | Manage likelihood, impact, and response |
            | `tickets:work` | Work | Manage owner, priority, due date, and related documents |

            See [[ticket-management|Ticket Management]] for setup and use, and [[using-plugins|Using Plugins]] to install the plugin.

            ### Sets

            A set adds its document and ticket-management templates together. If a set includes a plugin template and that plugin is not enabled, that item is skipped with a reason.

            | ID | Name | Contents |
            | --- | --- | --- |
            | `start` | Start | Project charter, background and problem, stakeholders and roles, glossary |
            | `planning` | Planning | Roadmap, current status, scope, work and risk trackers |
            | `predictive` | Predictive additions | Project plan, communication plan, issue, Q&A, and change-request trackers |
            | `iterative` | Iterative additions | Backlog tracker |
            | `requirements` | Requirements | Functional and non-functional requirements |
            | `design` | Design | Architecture overview, first decision record, screen design, data design |
            | `quality-release` | Quality and release | Test plan, acceptance scenario, release record, bug tracker |
            | `operations` | Operations | Operations design, incident response procedure |
            | `sprint` | Sprint | A sprint page in a folder named for the sprint (repeatable) |
            | `phase` | Phase | A phase page and review-finding tracker in a folder named for the phase (repeatable) |

            ## Add from the UI

            Open the menu for the folder where you want to add content, then choose "Create from template" or "Add a set." Select the template or set to see the files to create or skip and their destinations. For a repeatable set, enter a name before reviewing the plan, then choose "Create." Existing files at the same path are skipped rather than overwritten.

            Select "Append this usage to VELLYM.md" in the confirmation dialog to add usage instructions to the end of an existing `VELLYM.md`. Existing content is preserved and the same section is not added twice. If the file does not exist, Vellym does not create it.

            ## Add from the CLI

            List candidates with `vellym add --list template` or `vellym add --list set`, then use their IDs.

            ```bash
            vellym add --list template
            vellym add --list set
            vellym add template roadmap
            vellym add set start
            vellym add set sprint --name "Sprint 3"
            vellym add set phase --name "Requirements" --dry-run
            ```

            A document template goes to the folder for its role in the selected structure by default. Use `--folder <path>` to override it. To add a plugin template directly, provide both `<plugin-id>:<id>` and `--folder`. For example, in the default Japanese By type structure:

            ```bash
            vellym add template tickets:work --folder "管理"
            ```

            `--dry-run` displays the plan without writing files. `--json` emits JSON; `--config <path>` selects a config file. Add `--guide` to append usage instructions to `VELLYM.md`. By default no guide is appended (`--no-guide`), so a normal add does not change the existing guide.

