apiVersion: vellym.tasclub.com/v1alpha1
kind: Page
metadata:
  name: browser-guide
  title: ブラウザ画面の使い方
spec:
  documentType: guide
  locale: ja
  blocks:
    - id: browser-guide
      type: rich-text
      format: commonmark
      content: |
        ## 対象

        このページは、`vellym dev`で起動したブラウザ画面（動的版）を使う利用者向けである。
        起動方法は[はじめかた](#page=getting-started)、コマンドは[CLIリファレンス](#page=cli-reference)を参照。静的版（`build`）は
        閲覧専用で、編集・検索・設定は含まれない（[静的配信と自己ホスト](#page=self-hosting)）。

        ## 初期セットアップ

        設定ファイルが無いプロジェクトで`vellym dev`を起動すると、初期セットアップが表示される。
        次の流れで進む。

        1. **はじめに**: 画面と初期文書の**言語**を選ぶ。
        2. **保存先**: 文書を保存する**コンテンツフォルダ**（project rootからの相対パス）を確認・指定する。
           開始したプロジェクトの外へは書き込まない。存在しないフォルダは作成する。
        3. **構成**: profile（構成）を選ぶと、作成する文書の一覧が表示される。チェックで作成対象を
           増減でき、既存と重なる文書は既定で外れる。ファイル名は変更できる。
        4. **完了**: 作成件数が表示され、最初の文書を開いてワークスペースへ移動する。

        完了後は同じサーバーのまま文書ワークスペースへ切り替わる。

        ## 画面の構成

        - **プロダクトレール**（左端）: 「文書」と「設定」を切り替える。
        - **文書ナビゲーション**: 文書ツリーを開閉・幅調整できる。ツリーからページを選ぶ。
        - **アウトライン**: 表示中ページの見出し一覧。
        - **パンくず**: 現在位置の階層を示す。

        ## 閲覧

        文書ツリーからページを選ぶと本文が表示される。本文中の内部リンク（`#page=`形式）を
        たどって関連ページへ移動できる。

        Pageに複数の公開言語がある場合は、本文上部の言語切り替えから同じPageの別言語へ移動できる。
        URLは既定言語では`/pages/<slug>/`、追加言語では`/<locale>/pages/<slug>/`となる。
        言語切り替えは、そのPageに複数の公開言語がある場合だけ表示する。選択中の言語に
        翻訳がないPageは既定言語で表示されるため、文書ツリーの件数と構造は言語で変わらない。

        ## 検索

        「文書を検索」から**全文検索**を開き、語句でページ本文を横断的に探せる。
        （全文検索は動的版の機能で、静的版には含まれない。）

        ## 編集と保存

        - ページ本文はブラウザ上で編集できる。リッチテキスト編集と、YAMLの直接編集の
          両方に対応する。
        - 保存すると、内容は**ローカルのYAMLへ書き戻される**（Gitのcommitは行わない）。
        - 編集中に元のYAMLが外部で変更された場合は、競合として検知し、下書きとYAMLを
          見比べて対応できる。
        - 未保存の変更があるまま画面を離れようとすると、確認ダイアログで下書きの保持や
          破棄を選べる。

        ## 言語の追加と編集

        編集画面の言語操作から、既存Pageへ日本語または英語を追加できる。追加時は空の翻訳、
        正本のコピー、既存翻訳のコピーから開始方法を選ぶ。言語ごとにtitleとblocksを編集するが、
        Page IDとslugは共通である。

        複数言語に未保存変更があっても、一回の保存でまとめてYAMLへ反映される。各言語の
        追加・削除は保存するまで確定しない。競合時は対象localeとYAML pathを
        確認でき、全言語の下書きを退避できる。Folderの表示名と説明にも同じ言語追加操作がある。

        ## 新規作成・構造編集

        - 「新規作成」からページやフォルダを追加できる。
        - 既存のページ・フォルダは、名称変更（編集）、移動、アーカイブができる。
        - 並べ替えの結果はフォルダの表示順（`_index.yaml`）に反映される。

        ## 設定・管理

        「設定」には、ソース情報（project root・content root・設定ファイルの場所）や
        読み込み状態、保存方式（ローカルYAMLへ書き込み）などの管理情報が表示される。
        日常の閲覧画面には出さない詳細情報をここで確認できる。

        ## 関連

        - YAMLの書き方 → [文書の書き方（YAML）](#page=authoring)
        - 静的配信 → [静的配信と自己ホスト](#page=self-hosting)
        - 現段階の範囲 → [現段階の範囲と制約](#page=limitations)
  translations:
    en:
      visibility: published
      title: Using the Browser UI
      blocks:
        - id: browser-guide
          type: rich-text
          format: commonmark
          content: |
            ## Audience

            This page is for users of the browser UI (dynamic mode) started with
            `vellym dev`. See [Getting Started](#page=getting-started) to start it and [CLI Reference](#page=cli-reference) for
            commands. The static build is read-only and has no editing, search, or settings
            ([Static Publishing and Self-Hosting](#page=self-hosting)).

            ## Initial setup

            Running `vellym dev` in a project without a config file shows the initial setup,
            which proceeds as follows.

            1. **Intro**: choose the **language** of the UI and initial documents.
            2. **Location**: confirm or set the **content folder** (relative to project root)
               where documents are saved. It never writes outside the project you started in,
               and it creates the folder if it does not exist.
            3. **Structure**: pick a profile; the list of documents to create appears. Toggle
               which ones to create (documents that collide with existing ones are unchecked
               by default), and rename files if needed.
            4. **Done**: the number created is shown; open the first document to enter the
               workspace.

            After completion it switches to the document workspace on the same server.

            ## Layout

            - **Product rail** (far left): switch between "Documents" and "Settings".
            - **Document navigation**: open/close and resize the document tree; pick a page.
            - **Outline**: the heading list of the current page.
            - **Breadcrumbs**: the hierarchy of your current location.

            ## Reading

            Select a page from the document tree to view its body. Follow internal links
            (`#page=` links) in the body to move to related pages.

            When a Page has multiple published locales, use the language switcher above the
            body to open the same Page in another language. Default-locale URLs use
            `/pages/<slug>/`; additional locales use `/<locale>/pages/<slug>/`. If an internal
            The switcher appears only when that Page has multiple published locales. A Page
            without the selected translation is shown in its default language, so the document
            tree keeps the same count and structure in every language.

            ## Search

            Open **full-text search** ("Search documents") to find text across page bodies.
            (Full-text search is a dynamic-mode feature and is not in the static build.)

            ## Editing and saving

            - Page bodies can be edited in the browser, both as rich text and as direct YAML.
            - Saving writes the content back to **local YAML** (it does not create a Git commit).
            - If the underlying YAML changes externally while you edit, the conflict is
              detected and you can compare your draft with the YAML.
            - If you try to leave with unsaved changes, a dialog lets you keep or discard the draft.

            ## Adding and editing languages

            From the editor's language controls, add Japanese or English to the current Page.
            Start from an empty translation, a copy of the canonical Page, or a copy of an
            existing translation. Titles and blocks are language-specific; Page ID and slug remain shared.

            Unsaved changes in multiple locales are committed to YAML in one save. Adding or
            removing a locale does not take effect until that save. Conflicts
            identify the locale and YAML path, and all language drafts can be exported for
            recovery. Folder display titles and descriptions have equivalent language controls.

            ## Creating and structure editing

            - Use "Create" to add pages or folders.
            - Existing pages and folders can be renamed (edit), moved, and archived.
            - Reordering is reflected in the folder's display order (`_index.yaml`).

            ## Settings and administration

            "Settings" shows source information (project root, content root, config file
            location), load state, and the save method (write to local YAML). It surfaces
            detailed information that is kept out of the everyday reading view.

            ## Related

            - Writing YAML → [Authoring Documents (YAML)](#page=authoring)
            - Static publishing → [Static Publishing and Self-Hosting](#page=self-hosting)
            - Current scope → [Current Scope and Limitations](#page=limitations)
