kind: Page
metadata:
  name: limitations
  title: 現段階の範囲と制約
spec:
  documentType: guide
  locale: ja
  blocks:
    - id: limitations
      type: rich-text
      format: commonmark
      content: |
        ## 位置づけ

        本ガイドは現在の実装を対象とする。ここでは、現段階で**利用できること**と、
        まだ**利用できないこと（今後の範囲）**を区別して示す。

        ## 現段階で利用できること

        - CLIの4コマンド: `init`・`dev`・`validate`・`build`（[[cli-reference|CLIリファレンス]]）
        - ブラウザの初期セットアップ（[[browser-guide|ブラウザ画面の使い方]]）
        - ブラウザ上の閲覧・アウトライン・ツリー・パンくず
        - ブラウザ上の編集と保存（ローカルYAMLへ書き戻し）
        - 全文検索（動的版）
        - 新規作成・名称変更・移動・アーカイブ・並べ替え（構造編集）
        - 一つのPage／Folder YAMLでの複数言語管理、UIからの言語追加・編集・公開・削除
        - locale別URL、Page単位の言語切り替え、既定言語fallback、locale別閲覧・検索
        - 閲覧専用の静的サイト生成と配信（[[self-hosting|静的配信と自己ホスト]]）
        - 本文ブロックは`rich-text`（CommonMark）（[[authoring|文書の書き方（YAML）]]）

        ## 現段階では利用できないこと（今後の範囲）

        次の機能はまだ実装されておらず、「利用可能」ではない。今後の拡張として扱う。

        - プラグイン／plugin SDK（設定の`plugins`は空配列のみ）
        - 差分表示
        - Vellymからのgit操作
        - `rich-text`以外の追加ブロック
        - preset
        - 自動翻訳、翻訳の鮮度判定、翻訳ワークフロー、翻訳担当者への通知

        ## 製品の方針

        - Vellym製品内には、AIモデル・AIチャット・AI生成・AIレビューを**組み込まない**。
          外部AIエージェントがYAML・JSON・CLIを通常のファイルとして扱うことは、これとは別で、妨げない。
        - 文書の唯一の正本はGit管理できるYAMLであり、HTMLや静的サイトは生成物である。

        ## 既知の注意点

        - 静的サイトは`file://`では表示できない。必ずHTTPで配信する（[[self-hosting|静的配信と自己ホスト]]）。
        - `dev`は既定で`127.0.0.1`にバインドする。Vellymに認証はないため、
          `--host 0.0.0.0`で起動したサーバーへ到達できる相手は、文書の閲覧・編集・構成変更ができる。
          信頼できるネットワークだけで使用する。
        - Dockerイメージのレジストリ公開・バージョン固定・更新手順は未確定。
        - 新規文書は`v1`で生成する。既存の`v1alpha1`はそのまま利用でき、明示的なmigrationも
          利用できるが、正式な`v1`契約はRCまで変更される可能性がある。
        - 自動検証はChromiumで実施している（axe、キーボード、320 CSS px、文字200%、
          日本語確定入力、CommonMark往復）。Safari、Firefox、VoiceOver等のスクリーンリーダーは
          **未検証**である。気づいた点はIssueフォームから報告してほしい。

        ## 関連

        - 全体像 → [[welcome|Vellymとは]]
        - コマンド → [[cli-reference|CLIリファレンス]]
  translations:
    en:
      visibility: published
      title: Current Scope and Limitations
      blocks:
        - id: limitations
          type: rich-text
          format: commonmark
          content: |
            ## Positioning

            This guide covers the current implementation. It distinguishes what is
            **available** at this stage from what is **not yet available (future scope)**.

            ## Available now

            - The four CLI commands: `init`, `dev`, `validate`, `build` ([[cli-reference|CLI Reference]])
            - In-browser initial setup ([[browser-guide|Using the Browser UI]])
            - In-browser reading, outline, tree, breadcrumbs
            - In-browser editing and saving (write-back to local YAML)
            - Full-text search (dynamic mode)
            - Create, rename, move, archive, reorder (structure editing)
            - Multiple languages in one Page / Folder YAML, including adding, editing,
              publishing, and removing locales from the UI
            - Locale URLs, per-Page language switching, default-language fallback, and locale-specific reading and search
            - Read-only static site generation and serving ([[self-hosting|Static Publishing and Self-Hosting]])
            - The `rich-text` (CommonMark) body block ([[authoring|Authoring Documents (YAML)]])

            ## Not available yet (future scope)

            The following are not implemented and are not "available". They are treated as
            future extensions.

            - Plugins / plugin SDK (the config `plugins` accepts only an empty array)
            - Diff view
            - Git operations from Vellym
            - Body blocks other than `rich-text`
            - Presets
            - Automatic translation, translation freshness detection, translation workflow,
              or translator notifications

            ## Product policy

            - No AI model, AI chat, AI generation, or AI review is embedded in the Vellym
              product. External AI agents treating YAML/JSON/CLI as ordinary files is a
              separate matter and is not prevented.
            - The single source of truth is Git-managed YAML; HTML and static sites are artifacts.

            ## Known caveats

            - A static site cannot be served over `file://`; always serve it over HTTP
              ([[self-hosting|Static Publishing and Self-Hosting]]).
            - `dev` binds to `127.0.0.1` by default. Vellym has no authentication, so anyone who
              can reach a `--host 0.0.0.0` server can read, edit, and restructure your documents.
              Use it only on a trusted network.
            - Registry publishing, version pinning, and update procedures for the Docker image
              are not finalized.
            - New documents are generated as `v1`. Existing `v1alpha1` documents keep working, and
              explicit migration is available, but the formal `v1` contract may change until the
              release candidate.
            - Automated verification runs on Chromium (axe, keyboard, 320 CSS px, 200% text,
              Japanese IME composition, CommonMark round-trip). Safari, Firefox, and screen
              readers such as VoiceOver are **not verified** at this stage. Please report what
              you find through the issue form.

            ## Related

            - Big picture → [[welcome|What is Vellym]]
            - Commands → [[cli-reference|CLI Reference]]
