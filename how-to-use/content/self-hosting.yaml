apiVersion: vellym.tasclub.com/v1alpha1
kind: Page
metadata:
  name: self-hosting
  title: 静的配信と自己ホスト
spec:
  documentType: guide
  locale: ja
  blocks:
    - id: self-hosting
      type: rich-text
      format: commonmark
      content: |
        ## 対象

        このページは、文書を静的サイトとして配布したい人、Vellymを自己ホストで
        運用したい人向けである。コマンドの詳細は[CLIリファレンス](#page=cli-reference)を参照。

        ## 静的サイトを書き出す

        ```bash
        vellym build
        ```

        正本から**閲覧専用**の静的サイト（SPA）を書き出す。エラーがある場合は生成を中止する。
        含まれるのは閲覧機能だけで、編集・保存・構成管理・全文検索・設定は含まれない。

        生成物には次が含まれる。

        * `index.html`と`pages/<slug>/index.html`: 既定言語の入口とPage URL

        * `<locale>/index.html`と`<locale>/pages/<slug>/index.html`: 追加言語の入口とPage URL

        * `assets/`: 全言語で共有するJS・CSS

        * `data/<build ID>/<locale>/`: 言語別データ（`bootstrap.json` / `repository.json` / `pages/*.json`）

        * `vellym-build.json`: ビルドID・既定言語・公開言語・ソースリビジョンなどの来歴

        * `README.md`: 配信手順

        既定言語は従来どおりルートへ生成される。追加言語のtreeにも全Pageが含まれ、公開済み
        translationがないPageは既定言語のタイトルと本文を使う。Page件数と構造は言語で変わらない。
        `draft`は翻訳として公開されず、既定言語へfallbackする。
        HTMLとJSONのbuild IDが一致しない場合は、世代混在として画面にエラーを表示する。

        ## 出力先と世代

        生成物は、設定の`outputDir`の**親**ディレクトリに、生成日時を付けた一意な
        フォルダとして置かれる（例: `20260728-143002-dist`）。毎回別フォルダになるため、
        過去の生成物は上書きされずに残る。設定は[設定ファイル](#page=configuration)を参照。

        ## 配信（HTTPで配信する）

        生成物は**HTTP経由で配信**する。`index.html`をブラウザで直接開く（`file://`）と、
        ブラウザのセキュリティ制約でJS・CSS・データを読み込めず表示できない。

        生成したフォルダで次のいずれかを実行する。

        ```bash
        # Python
        python3 -m http.server 8080

        # Node
        npx serve .
        # または
        npx http-server -p 8080
        ```

        起動後、ブラウザで `http://localhost:8080/` を開く。相対パスで動作するため、
        サーバーのサブディレクトリ配下に置いても表示できる（Nginx／Apache等の
        ドキュメントルートに置く配信も可能）。

        `static.publicBaseUrl`を設定すると、Page HTMLへcanonicalと、そのPageで公開済みの
        言語だけを指すhreflangを出力する。値は配信先のHTTPS URLで、末尾に`/`が必要である。
        未設定時は誤った公開URLを埋め込まないため、canonicalとhreflangを出力しない。

        ## Dockerで動かす（自己ホスト）

        Node.jsをホストへ導入しない運用として、配布候補のruntimeイメージを使う方法がある。

        ```bash
        docker build --target runtime -t vellym:local .
        docker run --rm \
          -p 127.0.0.1:4173:4173 \
          -v "$PWD/testdocs:/workspace" \
          vellym:local
        ```

        コンテナ内では`0.0.0.0:4173`で待ち受ける。**公開先は`127.0.0.1:4173`へ限定**し、
        同一ネットワークへ不用意に公開しない。空のワークスペースではブラウザセットアップが
        表示され、作成内容はマウント元へ保存される。

        > イメージレジストリへの公開、バージョン固定、更新手順はまだ確定していない。

        ## 関連

        * 静的版と動的版の違い → [用語と基本概念](#page=concepts)

        * 設定ファイル → [設定ファイル](#page=configuration)

        * 現段階の範囲 → [現段階の範囲と制約](#page=limitations)
  translations:
    en:
      visibility: published
      title: Static Publishing and Self-Hosting
      blocks:
        - id: self-hosting
          type: rich-text
          format: commonmark
          content: |
            ## Audience

            This page is for people who want to distribute documents as a static site, or run
            Vellym self-hosted. For command details, see [CLI Reference](#page=cli-reference).

            ## Export a static site

            ```bash
            vellym build
            ```

            Exports a **read-only** static site (SPA) from the source. If there are errors,
            generation is aborted. It includes reading only — no editing, saving, structure
            management, full-text search, or settings.

            The output contains:

            - `index.html` and `pages/<slug>/index.html`: default-locale entry points and Page URLs
            - `<locale>/index.html` and `<locale>/pages/<slug>/index.html`: additional-locale entry points and Page URLs
            - `assets/`: JS and CSS shared by all locales
            - `data/<build ID>/<locale>/`: locale data (`bootstrap.json` / `repository.json` / `pages/*.json`)
            - `vellym-build.json`: build ID, default and published locales, source revision, and other provenance
            - `README.md`: serving instructions

            The default locale remains at the root for backward compatibility. An additional
            locale keeps every Page in the tree; Pages without a published translation use
            their default-language title and body. Drafts likewise fall back to the default.
            If HTML and JSON build IDs differ, the UI reports a
            mixed-generation error.

            ## Output location and generations

            Output goes into the **parent** of the config's `outputDir`, as a unique
            timestamped folder (e.g. `20260728-143002-dist`). Because each build is a new
            folder, previous outputs are not overwritten. See [Configuration File](#page=configuration).

            ## Serving (serve over HTTP)

            Serve the output **over HTTP**. Opening `index.html` directly in a browser
            (`file://`) fails: browser security prevents loading JS, CSS, and data.

            In the generated folder, run one of:

            ```bash
            # Python
            python3 -m http.server 8080

            # Node
            npx serve .
            # or
            npx http-server -p 8080
            ```

            Then open `http://localhost:8080/`. It uses relative paths, so it also works under
            a server subdirectory (or as the document root of Nginx / Apache, etc.).

            With `static.publicBaseUrl`, Page HTML includes canonical and hreflang links only
            for that Page's published locales. The value must be the public HTTPS URL ending in
            `/`. Without it, Vellym omits those links rather than embedding a guessed URL.

            ## Run with Docker (self-hosting)

            To avoid installing Node.js on the host, you can use the candidate runtime image.

            ```bash
            docker build --target runtime -t vellym:local .
            docker run --rm \
              -p 127.0.0.1:4173:4173 \
              -v "$PWD/testdocs:/workspace" \
              vellym:local
            ```

            Inside the container it listens on `0.0.0.0:4173`. **Limit the published address to
            `127.0.0.1:4173`** and do not carelessly expose it to the wider network. An empty
            workspace shows the browser setup, and created content is saved back to the mount.

            > Publishing to an image registry, pinning versions, and update procedures are not
            > finalized yet.

            ## Related

            - Static vs. dynamic → [Terminology and Concepts](#page=concepts)
            - Config file → [Configuration File](#page=configuration)
            - Current scope → [Current Scope and Limitations](#page=limitations)
