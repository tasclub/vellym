name: Publish

# GitHub Release を published にすると npm へ provenance 付きで公開する。
#
# 認証はnpmのTrusted Publishing（OIDC）を使い、publish用のtokenは保持しない。
# npm側でpackage @vellym/plugin-api、@vellym/tickets、vellymそれぞれの
# Trusted Publisherに、このリポジトリとworkflowファイル名publish.ymlを
# 登録しておくこと（Environmentは未設定）。
# npm CLIは11.5.1以降が必要で、Node.js 24に同梱される版がこれを満たす。
#
# dist-tagの変更はこのworkflowでは行わない。OIDCの資格情報はpublishに限定され、
# dist-tagのPUTは401になるため。prerelease時のlatest更新は公開後に手元で実行する。
on:
  release:
    types: [published]
  # 公開だけが失敗した場合に、tagとReleaseを作り直さず再実行できるようにする。
  workflow_dispatch:
    inputs:
      tag:
        description: "公開するrelease tag（例: v0.3.0-beta.1）"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing の認証と provenance の署名に必要
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      # registry-urlは指定しない。指定するとsetup-nodeが
      # _authToken=${NODE_AUTH_TOKEN}を含む.npmrcを生成し、
      # NODE_AUTH_TOKENへダミー値を設定する。npmはそれを認証情報とみなして
      # OIDCの交換を行わず、publishが404になる。
      # registryの既定値はhttps://registry.npmjs.org/のため指定は不要。
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:check -- "$RELEASE_TAG"
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:core
      # OIDCへ乗る前提条件を失敗前に確認する。
      # npm 11.5.1以降と、id-token: writeによるOIDC要求URLの両方が必要。
      - name: Show npm auth configuration
        run: |
          echo "npm: $(npm --version)"
          echo "registry: $(npm config get registry)"
          echo "userconfig: ${NPM_CONFIG_USERCONFIG:-(none)}"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC要求URL: あり"
          else
            echo "OIDC要求URL: なし（id-token権限を確認する）"
          fi
      # package directoryから依存順に実行する。--workspace経由ではnpmがOIDCの交換を
      # 行わずENEEDAUTHになるため、trusted publishingでは通常のpublishと同じ形にする。
      # 各package.jsonの版からdist-tagを決め、同じ版が公開済みなら再実行時に飛ばす。
      - id: plugin_api_publish
        name: Publish @vellym/plugin-api to npm
        working-directory: packages/plugin-api
        run: bash ../../scripts/publish-package.sh
      - id: tickets_publish
        name: Publish @vellym/tickets to npm
        working-directory: packages/plugin-tickets
        run: bash ../../scripts/publish-package.sh
      - id: vellym_publish
        name: Publish vellym to npm
        working-directory: packages/vellym
        run: bash ../../scripts/publish-package.sh
      # prereleaseはlatestを指さないまま公開される。1.0未満の間latestを持たないと
      # `npx vellym`が解決できないため、公開後にlatestを同じ版へ向ける。
      # OIDCの資格情報はpublishに限定されdist-tagのPUTは401になるので、
      # ここでは実行せず手順を出力するだけにする。
      - name: Next step for the latest dist-tag
        if: steps.vellym_publish.outputs.tag != 'latest'
        run: |
          {
            echo "### 公開後の手作業"
            echo
            echo "prereleaseのため\`latest\`は更新されていない。npmへログイン済みの環境で実行する。"
            echo
            echo '```bash'
            echo "npm dist-tag add vellym@${{ steps.vellym_publish.outputs.version }} latest"
            echo "npm dist-tag ls vellym"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
