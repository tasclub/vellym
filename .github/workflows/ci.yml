name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # 手動受入をリリースgateにしていないため、WCAG・keyboard・IME・検索応答の
  # 回帰はこのjobだけが検出する。publish時だけでなくPRごとに実行する。
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:core
      - run: npm run verify:scale
      # 公開サイトの成果物は、これまでデプロイ時にしか検証していなかった。
      # そのため静的出力だけで起きる回帰（相対URLの再解決、焼き込みJSONの欠落）を
      # PRで止められず、デプロイの直前まで気づけなかった。chromiumはこのjobが
      # 既に入れているため、ここへ足すのが一番安い。
      - run: npm run site:verify
