name: Bug report
description: Report reproducible incorrect behavior or data-safety concerns.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach private project documents. Replace content with a minimal example.
  - type: input
    id: version
    attributes:
      label: Vellym version
      placeholder: Output of npx vellym@beta --version
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Node.js 22, Node.js 24, Docker, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the command, minimal YAML, and browser when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: This may have lost, overwritten, or exposed user data.
